<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI非言語分野 演習＆CBT模擬試験</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans JP', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        #explanation-content strong {
            color: #c7d2fe;
            font-weight: 700;
            background-color: rgba(99, 102, 241, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid rgba(129, 140, 248, 0.4);
            font-family: monospace, sans-serif;
            font-size: 0.9em;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-[#111827]/90 backdrop-blur-md text-white border-b border-slate-800/80 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <button onclick="goToLanding()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-3 rounded-xl text-xs transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-house text-indigo-400"></i>
                    <span class="hidden sm:inline">トップ</span>
                </button>
                
                <button id="nav-change-config-btn" onclick="goToSelectScreen()" class="hidden bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-200 border border-indigo-700/60 py-1.5 px-3 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>単元・レベル変更</span>
                </button>

                <button onclick="openReviewModal()" class="text-xs bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-700/60 py-1.5 px-3 rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>回答振り返り</span>
                </button>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-1.5 px-3 rounded-xl transition flex items-center space-x-1">
                    <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                    <span class="inline">履歴</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

        <!-- 1. LANDING VIEW -->
        <section id="view-landing" class="w-full animate-fade-in my-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-800 text-center max-w-lg mx-auto">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-4 border border-indigo-500/20">
                    <i class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white mb-2">SPI非言語問題 演習アプリ</h1>
                <p class="text-xs md:text-sm text-slate-400 mb-8 leading-relaxed">
                    単元とレベルを自由に組み合わせてじっくり演習・CBT模擬試験
                </p>

                <div class="space-y-4">
                    <button onclick="goToSelectScreen()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-indigo-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">通常 問題演習モード</h3>
                                <p class="text-[11px] text-indigo-200 font-normal">単元とレベルを選んで集中演習</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-indigo-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="openCBTModal()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-emerald-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">CBT 模擬試験モード</h3>
                                <p class="text-[11px] text-emerald-200 font-normal">本番形式の問題可変型テスト</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>

                <div class="mt-8 pt-5 border-t border-slate-800 flex justify-center items-center space-x-3">
                    <button onclick="openHistoryModal()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                        <span>学習履歴 (直近10回)</span>
                    </button>
                    <button onclick="resetStats()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>成績クリア</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. UNIT & LEVEL SELECT VIEW -->
        <section id="view-select" class="hidden w-full animate-fade-in max-w-xl mx-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 shadow-xl border border-slate-800">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-800">
                    <h2 class="text-lg font-extrabold text-white flex items-center">
                        <i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>単元・レベルの選択
                    </h2>
                    <span class="text-xs text-slate-400">ステップ 1/2</span>
                </div>

                <!-- Unit Choice Cards (9 Units) -->
                <div class="mb-6">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">演習する単元</label>
                    <div class="grid grid-cols-2 gap-2" id="unit-selection-grid">
                        <button onclick="selectConfigUnit('all')" data-unit="all" class="cfg-unit-btn p-3 rounded-2xl border text-left transition flex items-center space-x-2.5 bg-indigo-600 border-indigo-400 text-white font-bold">
                            <i class="fa-solid fa-layer-group text-base"></i>
                            <div>
                                <div class="text-xs font-bold">全単元 混合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('set')" data-unit="set" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-diagram-project text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">① 集合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('settlement')" data-unit="settlement" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-calculator text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">② 代金清算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('discount')" data-unit="discount" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-tags text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">③ 料金割引</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('installment')" data-unit="installment" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-credit-card text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">④ 分割払い</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('speed')" data-unit="speed" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-gauge-high text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑤ 速さ</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('profit')" data-unit="profit" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-coins text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑥ 損益算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('probability')" data-unit="probability" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-dice text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑦ 場合の数・確率</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('logical')" data-unit="logical" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-brain text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑧ 推論</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('table')" data-unit="table" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-table-cells text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑨ 表の読み取り</div>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Level Choice Options -->
                <div class="mb-8">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">難易度（レベル）</label>
                    <div class="grid grid-cols-4 gap-2" id="level-selection-grid">
                        <button onclick="selectConfigLevel('all')" data-level="all" class="cfg-lvl-btn p-2.5 rounded-xl border border-indigo-400 bg-indigo-600 text-white text-xs font-bold text-center">
                            全レベル
                        </button>
                        <button onclick="selectConfigLevel('1')" data-level="1" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.1 基本
                        </button>
                        <button onclick="selectConfigLevel('2')" data-level="2" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.2 応用
                        </button>
                        <button onclick="selectConfigLevel('3')" data-level="3" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.3 高難度
                        </button>
                    </div>
                </div>

                <button onclick="startPracticeWithConfig()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-950/60 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>この条件で演習を始める</span>
                </button>
            </div>
        </section>

        <!-- 3. CBT MOCK EXAM DISPLAY -->
        <section id="cbt-status-bar" class="hidden mb-5 bg-[#141a2e] text-white rounded-3xl p-5 shadow-2xl border border-slate-800 max-w-2xl mx-auto w-full animate-fade-in">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                
                <div class="relative w-24 h-24 flex items-center justify-center shrink-0">
                    <svg class="w-full h-full" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="50" stroke="#1e293b" stroke-width="8" fill="transparent" />
                        <circle id="cbt-circle-outer" class="progress-ring-circle" cx="60" cy="60" r="50" 
                                stroke="#10b981" stroke-width="8" fill="transparent" 
                                stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="0" />
                        
                        <circle cx="60" cy="60" r="36" stroke="#1e293b" stroke-width="8" fill="transparent" />
                        <circle id="cbt-circle-inner" class="progress-ring-circle" cx="60" cy="60" r="36" 
                                stroke="#6366f1" stroke-width="8" fill="transparent" 
                                stroke-linecap="round" stroke-dasharray="226.19" stroke-dashoffset="226.19" />
                    </svg>
                </div>

                <div class="flex-grow text-center sm:text-left">
                    <div class="flex items-center justify-center sm:justify-start space-x-2">
                        <span id="cbt-mode-badge" class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold inline-flex items-center">
                            <i class="fa-solid fa-laptop-code mr-1.5"></i> ミニテスト
                        </span>
                        <span class="text-xs text-slate-400 font-medium">CBT模擬試験中</span>
                    </div>
                </div>

                <div class="shrink-0 w-full sm:w-auto">
                    <button onclick="exitCBTMode()" class="w-full sm:w-auto bg-slate-800/90 hover:bg-rose-950/50 hover:text-rose-300 text-slate-400 border border-slate-700/80 hover:border-rose-800/60 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-rectangle-xmark"></i>
                        <span>テスト中断</span>
                    </button>
                </div>

            </div>
        </section>

        <!-- 4. PRACTICE VIEW -->
        <section id="view-practice" class="hidden w-full animate-fade-in max-w-2xl mx-auto my-auto">
            
            <div id="practice-config-banner" class="mb-4 bg-[#141a2e] rounded-xl px-4 py-2.5 border border-slate-800 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">現在の設定:</span>
                    <span id="active-config-badge" class="px-2.5 py-0.5 rounded-md bg-indigo-950 text-indigo-300 font-bold border border-indigo-800/50">
                        全単元 / 全レベル
                    </span>
                </div>
                <button onclick="goToSelectScreen()" class="text-indigo-400 hover:text-indigo-300 font-bold flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-[10px]"></i>
                    <span>変更</span>
                </button>
            </div>

            <!-- Question Card -->
            <div id="question-card" class="bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 relative overflow-hidden mb-5">
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                    <div id="timer-bar" class="bg-indigo-500 h-full w-full transition-all duration-100 linear"></div>
                </div>

                <div id="q-meta-header" class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 text-xs">
                    <div class="flex items-center space-x-2">
                        <span id="unit-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-slate-800 text-slate-200 border border-slate-700">
                            単元
                        </span>
                        <span id="q-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                            Lv.1
                        </span>
                    </div>
                    <span id="q-pattern-title" class="text-slate-400 font-medium truncate max-w-[200px]">
                        パターン名
                    </span>
                </div>

                <div class="text-slate-100 text-sm md:text-base leading-relaxed font-medium mb-5" id="q-text">
                    問題を取得しています...
                </div>

                <div class="bg-[#1c243c] border-l-4 border-indigo-500 p-3.5 rounded-r-xl mb-5">
                    <p class="font-bold text-indigo-200 text-xs md:text-sm" id="q-prompt">
                        ---
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5" id="choices-container">
                    <!-- Choice Buttons dynamically rendered -->
                </div>
            </div>

            <!-- Explanation Card -->
            <div id="explanation-card" class="hidden bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 animate-fade-in mb-5">
                <div id="result-banner" class="rounded-2xl p-4 mb-5 flex items-center space-x-3">
                </div>

                <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center">
                    <i class="fa-solid fa-lightbulb text-amber-400 mr-2"></i>解法・解説ステップ
                </h3>

                <div class="space-y-3 text-xs md:text-sm text-slate-300 leading-relaxed mb-6" id="explanation-content">
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-end">
                    <button onclick="generateNewQuestion()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-indigo-950/50">
                        <span>次の問題に進む</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 5. CBT RESULT CARD VIEW -->
        <section id="cbt-result-card" class="hidden bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-xl border border-slate-800 max-w-2xl mx-auto w-full animate-fade-in">
            <div class="text-center pb-5 border-b border-slate-800 mb-6">
                <span class="px-3 py-1 bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 rounded-full text-xs font-bold">
                    CBT TEST RESULT
                </span>
                <h2 class="text-2xl font-extrabold text-white mt-2">CBT模擬試験 結果</h2>
            </div>

            <!-- 一斉テスト実施日表示 -->
            <div id="cbt-sync-date-display" class="hidden text-center mb-4 text-xs font-bold text-indigo-300 bg-indigo-950/60 py-2.5 px-4 rounded-2xl border border-indigo-800/50">
                <i class="fa-solid fa-calendar-day text-indigo-400 mr-1.5"></i>一斉テスト実施日: <span id="cbt-res-date-val"></span>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解数</span>
                    <p class="text-xl font-black text-indigo-400" id="cbt-res-score">0 / 10</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解率</span>
                    <p class="text-xl font-black text-emerald-400" id="cbt-res-accuracy">0 %</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">到達レベル</span>
                    <p class="text-xl font-black text-purple-400" id="cbt-res-final-lvl">Lv.1</p>
                </div>
            </div>

            <!-- 結果コピーボタン (申告用) -->
            <div class="mb-4">
                <button id="copy-cbt-result-btn" onclick="copyCBTResult()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold transition text-xs shadow-lg shadow-emerald-950/50 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-copy"></i>
                    <span>結果をコピー (申告用)</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="openReviewModal()" class="w-full py-3.5 rounded-2xl bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/60 font-bold transition text-xs shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-list-check"></i>
                    <span>回答振り返り</span>
                </button>
                <button onclick="goToLanding()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition text-xs shadow-lg">
                    トップ画面に戻る
                </button>
            </div>
        </section>

    </main>

    <!-- SCRIPT LOGIC -->
    <script>
        let configUnit = 'all';
        let configLevel = 'all';

        let currentQuestion = null;
        let isAnswered = false;
        let totalCount = 0;
        let correctCount = 0;
        
        let questionTimerInterval = null;
        let maxQuestionTime = 90;
        let remainingQuestionTime = 90;

        let isCBTMode = false;
        let cbtModeType = 'mini';
        let cbtTotalQuestions = 9;
        let cbtMaxOverallTime = 720; // 12分 (12 * 60 = 720秒)
        let cbtQuestionIndex = 0;
        let cbtCurrentLevel = 1;
        let cbtOverallTimerInterval = null;
        let cbtOverallRemainingTime = 720;
        let cbtSyncDate = null;
        let cbtUnitQueue = [];

        let globalHistory = [];
        let sessionAnswers = [];

        // --- シード付き乱数ジェネレーター (Mulberry32 PRNG) ---
        let currentPRNG = Math.random;

        function stringToSeed(str) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 16777619);
            }
            return h >>> 0;
        }

        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function initPRNG(seedStr) {
            if (seedStr) {
                const numericSeed = stringToSeed(seedStr);
                currentPRNG = mulberry32(numericSeed);
            } else {
                currentPRNG = Math.random;
            }
        }

        function getRand() {
            return currentPRNG();
        }

        function getRandomInt(min, max) {
            return Math.floor(getRand() * (max - min + 1)) + min;
        }

        function hideAllViews() {
            document.getElementById('view-landing').classList.add('hidden');
            document.getElementById('view-select').classList.add('hidden');
            document.getElementById('view-practice').classList.add('hidden');
            document.getElementById('cbt-status-bar').classList.add('hidden');
            document.getElementById('cbt-result-card').classList.add('hidden');
            const changeBtn = document.getElementById('nav-change-config-btn');
            if (changeBtn) changeBtn.classList.add('hidden');
        }

        function goToLanding() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            isCBTMode = false;
            hideAllViews();
            document.getElementById('view-landing').classList.remove('hidden');
        }

        function goToSelectScreen() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            isCBTMode = false;
            hideAllViews();
            document.getElementById('view-select').classList.remove('hidden');
        }

        function selectConfigUnit(unit) {
            configUnit = unit;
            document.querySelectorAll('.cfg-unit-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                if (btn.getAttribute('data-unit') === unit) {
                    btn.className = 'cfg-unit-btn p-3 rounded-2xl border text-left transition flex items-center space-x-2.5 bg-indigo-600 border-indigo-400 text-white font-bold';
                    if (icon) icon.className = icon.className.replace('text-indigo-400', 'text-white');
                } else {
                    btn.className = 'cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600';
                    if (icon) {
                        icon.className = icon.className.replace('text-white', 'text-indigo-400');
                        if (!icon.className.includes('text-indigo-400')) {
                            icon.className += ' text-indigo-400';
                        }
                    }
                }
            });
        }

        function selectConfigLevel(level) {
            configLevel = level;
            document.querySelectorAll('.cfg-lvl-btn').forEach(btn => {
                if (btn.getAttribute('data-level') === level) {
                    btn.className = 'cfg-lvl-btn p-2.5 rounded-xl border border-indigo-400 bg-indigo-600 text-white text-xs font-bold text-center';
                } else {
                    btn.className = 'cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600';
                }
            });
        }

        function updateActiveConfigBadge() {
            const unitNames = {
                'all': '全単元', 'set': '①集合', 'settlement': '②代金清算',
                'discount': '③料金割引', 'installment': '④分割払い', 'speed': '⑤速さ',
                'profit': '⑥損益算', 'probability': '⑦場合の数・確率', 'logical': '⑧推論', 'table': '⑨表の読み取り'
            };
            const levelNames = { 'all': '全レベル', '1': 'Lv.1', '2': 'Lv.2', '3': 'Lv.3' };

            const badge = document.getElementById('active-config-badge');
            if (badge) {
                badge.innerText = `${unitNames[configUnit] || '全単元'} / ${levelNames[configLevel] || '全レベル'}`;
            }
        }

        // --- 集合 (Set) ---
        function genSet1() {
            const total = getRandomInt(30, 50);
            const likeA = getRandomInt(15, 25);
            const likeB = getRandomInt(12, 20);
            const both = getRandomInt(5, Math.min(likeA, likeB) - 2);
            const union = likeA + likeB - both;
            const neither = total - union;

            return {
                unit: '集合', level: 1, badge: 'Lv.1 基本', title: '2つの要素の集合（ベン図）',
                text: `${total}人の学生にアンケートを行ったところ、サッカーが好きな人は ${likeA}人、バスケットボールが好きな人は ${likeB}人、両方好きな人は ${both}人 であった。`,
                prompt: 'どちらも好きではない人は何人か。', correctAnswer: neither, unitSuffix: '人', step: 1,
                steps: [
                    `ステップ1：少なくともどちらか一方が好きな人数（和集合）を計算する。<br><strong>${likeA} + ${likeB} - ${both} = ${union}人</strong>`,
                    `ステップ2：全体から和集合を引いて「どちらも好きでない人数」を求める。<br><strong>${total} - ${union} = ${neither}人</strong>`
                ]
            };
        }

        function genSet2() {
            const total = 100;
            const likeA = getRandomInt(50, 70);
            const likeB = getRandomInt(40, 60);
            const neither = getRandomInt(10, 20);
            const union = total - neither;
            const both = likeA + likeB - union;

            return {
                unit: '集合', level: 2, badge: 'Lv.2 応用', title: '全体集合からの逆算',
                text: `100人の受講生のうち、英語が得意な人は ${likeA}人、数学が得意な人は ${likeB}人、どちらも得意でない人は ${neither}人 であった。`,
                prompt: '両方とも得意な人は何人か。', correctAnswer: both, unitSuffix: '人', step: 1,
                steps: [
                    `ステップ1：少なくともどちらか得意な人数を求める。<br><strong>100 - ${neither} = ${union}人</strong>`,
                    `ステップ2：(Aが得意 + Bが得意) から和集合を差し引いて「両方得意」を求める。<br><strong>${likeA} + ${likeB} - ${union} = ${both}人</strong>`
                ]
            };
        }

        function genSet3() {
            const total = getRandomInt(6, 10) * 10;
            const neither = getRandomInt(1, 3) * 5;
            const union = total - neither;
            const minBoth = getRandomInt(1, 3) * 5; 
            const sumLikes = union + minBoth;
            const likeA = getRandomInt(Math.ceil(sumLikes / 2), sumLikes - 10);
            const likeB = sumLikes - likeA;
            const maxBoth = Math.min(likeA, likeB);

            const isMinQuestion = getRand() < 0.5;
            const promptText = isMinQuestion ? '両方とも好きな人の「最小人数」は何人か。' : '両方とも好きな人の「最大人数」は何人か。';
            const correctAnswerVal = isMinQuestion ? minBoth : maxBoth;

            return {
                unit: '集合', level: 3, badge: 'Lv.3 高難度', title: '両方該当する人数の範囲（極値）',
                text: `${total}人の学生に映画Aと映画Bの好き嫌いを調査したところ、映画Aが好きな人は ${likeA}人、映画Bが好きな人は ${likeB}人 であった。また、どちらも好きではない人は ${neither}人 であった。`,
                prompt: promptText, correctAnswer: correctAnswerVal, unitSuffix: '人', step: 5,
                steps: [
                    `ステップ1：少なくとも一方が好きな人数（和集合）を求める。<br><strong>${total}人 - ${neither}人 = ${union}人</strong>`,
                    `ステップ2：AとBの合計人数を求める。<br><strong>${likeA}人 + ${likeB}人 = ${likeA + likeB}人</strong>`,
                    isMinQuestion
                        ? `ステップ3【最小値】：重なりが最も小さくなるのは全体に広がったとき。<br><strong>${likeA + likeB}人 - ${union}人 = ${minBoth}人</strong>`
                        : `ステップ3【最大値】：重なりが最も大きくなるのは人数が少ない方が含まれるとき。<br><strong>${likeB}人</strong>`
                ]
            };
        }

        // --- 代金清算 ---
        function genSettlement1() {
            const priceA = getRandomInt(2, 5) * 100;
            const priceB = getRandomInt(3, 8) * 100;
            const countA = getRandomInt(2, 4);
            const countB = getRandomInt(2, 4);
            const total = (priceA * countA) + (priceB * countB);
            const perPerson = Math.round(total / 4);

            return {
                unit: '代金清算', level: 1, badge: 'Lv.1 基本', title: 'グループの均等割り勘',
                text: `4人のグループで買い物をして、1個 ${priceA}円 の商品Aを ${countA}個、1個 ${priceB}円 の商品Bを ${countB}個 購入した。代金は4人で均等に支払う。`,
                prompt: '1人あたりいくら支払うか。', correctAnswer: perPerson, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：全体の代金を計算する。<br><strong>(${priceA} × ${countA}) + (${priceB} × ${countB}) = ${total.toLocaleString()}円</strong>`,
                    `ステップ2：4人で均等に割る。<br><strong>${total.toLocaleString()} ÷ 4 = ${perPerson.toLocaleString()}円</strong>`
                ]
            };
        }

        function genSettlement2() {
            const perPerson = getRandomInt(10, 30) * 100;
            const total = perPerson * 3;

            const paidP = getRandomInt(Math.floor(perPerson / 100) + 5, Math.floor(total / 100) - 5) * 100;
            const remaining = total - paidP;
            
            const paidQ = getRandomInt(1, Math.floor(remaining / 100) - 1) * 100;
            const paidR = remaining - paidQ;

            const receiveP = paidP - perPerson;
            const diffQ = paidQ - perPerson;
            const diffR = paidR - perPerson;

            let payerName = 'Q';
            let payerDiff = Math.abs(diffQ);
            if (diffR < diffQ) {
                payerName = 'R';
                payerDiff = Math.abs(diffR);
            }

            return {
                unit: '代金清算', level: 2, badge: 'Lv.2 応用', title: '複数人の立替えと精算',
                text: `P、Q、Rの3人がドライブに行き、かかった費用 ${total.toLocaleString()}円 を等しく分担することにした。` +
                      `立替額は、Pが ${paidP.toLocaleString()}円、Qが ${paidQ.toLocaleString()}円、Rが ${paidR.toLocaleString()}円 であった。`,
                prompt: `${payerName} は P にいくら支払えば清算が完了するか。`,
                correctAnswer: payerDiff,
                unitSuffix: '円',
                step: 100,
                steps: [
                    `ステップ1：1人あたりの本来の負担額を計算する。<br><strong>${total.toLocaleString()}円 ÷ 3 = ${perPerson.toLocaleString()}円</strong>`,
                    `ステップ2：Pの受け取るべき金額（受給額）を求める。<br><strong>${paidP.toLocaleString()}円 - ${perPerson.toLocaleString()}円 = ${receiveP.toLocaleString()}円（受け取る）</strong>`,
                    `ステップ3：${payerName} の不足額（支払うべき金額）を求める。<br><strong>${perPerson.toLocaleString()}円 - ${(payerName === 'Q' ? paidQ : paidR).toLocaleString()}円 = ${payerDiff.toLocaleString()}円</strong>`
                ]
            };
        }

        function genSettlement3() {
            const sharedPerPerson = getRandomInt(15, 35) * 100;
            const sharedTotal = sharedPerPerson * 3;
            const personalA = getRandomInt(5, 15) * 100;
            const totalReceipt = sharedTotal + personalA;
            const paidB = totalReceipt;
            const payAtoB = sharedPerPerson + personalA;

            return {
                unit: '代金清算', level: 3, badge: 'Lv.3 高難度', title: '共同費用と個人立替の複合清算',
                text: `A、B、Cの3人で旅行に行き、レンタカー代などの共同費用 ${sharedTotal.toLocaleString()}円 がかかった。` +
                      `また、途中でAが個人で買い物をした代金 ${personalA.toLocaleString()}円 も含め、会計総額 ${totalReceipt.toLocaleString()}円 をBがまとめて支払った。` +
                      `共同費用は3人で均等に割るものとする。`,
                prompt: 'AはBにいくら支払えばよいか。',
                correctAnswer: payAtoB,
                unitSuffix: '円',
                step: 100,
                steps: [
                    `ステップ1：共同費用の1人あたりの負担額を求める。<br><strong>${sharedTotal.toLocaleString()}円 ÷ 3 = ${sharedPerPerson.toLocaleString()}円</strong>`,
                    `ステップ2：Aが負担すべき総額（共同分 ＋ 個人購入分）を求める。<br><strong>${sharedPerPerson.toLocaleString()}円 + ${personalA.toLocaleString()}円 = ${payAtoB.toLocaleString()}円</strong>`,
                    `ステップ3：Bが全額立て替えているため、Aは負担総額である <strong>${payAtoB.toLocaleString()}円</strong> を直接Bに支払う。`
                ]
            };
        }

        // --- 料金割引 ---
        function genDiscount1() {
            const rate = [10, 20, 25, 30, 40, 50][getRandomInt(0, 5)];
            const original = getRandomInt(20, 90) * 100;
            const discounted = Math.round(original * (1 - rate / 100));

            return {
                unit: '料金割引', level: 1, badge: 'Lv.1 基本', title: '定価の割引計算',
                text: `定価 ${original.toLocaleString()}円 の商品が、セールで ${rate}% 引きで販売されている。`,
                prompt: '割引後の販売価格はいくらか。', correctAnswer: discounted, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：割引後価格の割合を掛ける。<br><strong>${original.toLocaleString()} × (1 - ${rate/100}) = ${discounted.toLocaleString()}円</strong>`
                ]
            };
        }

        function genDiscount2() {
            const basePrice = getRandomInt(4, 8) * 100;
            const discountRate = [20, 25, 30, 50][getRandomInt(0, 3)];
            const planAPrice = Math.round(basePrice * (1 - discountRate / 100));
            const breakevenTimes = getRandomInt(3, 6); 
            const diffPrice = basePrice - planAPrice;
            const passFee = diffPrice * breakevenTimes;
            const correctAnswerVal = breakevenTimes + 1;

            return {
                unit: '料金割引', level: 2, badge: 'Lv.2 応用', title: 'プラン比較と損益分岐点',
                text: `ある施設では、通常1回 ${basePrice.toLocaleString()}円 の利用料がかかる。<br>` +
                      `【プランA】年会費無料で、1回あたりの利用料が ${discountRate}% 引き（${planAPrice.toLocaleString()}円）になる。<br>` +
                      `【プランB】月額パス ${passFee.toLocaleString()}円 を購入すると、何度利用しても1回あたりの利用料は 0円 になる。`,
                prompt: '月に何回以上利用する場合、プランBの方がプランAよりも支払総額が安くなるか。',
                correctAnswer: correctAnswerVal,
                unitSuffix: '回以上',
                step: 1,
                steps: [
                    `ステップ1：プランBがプランAよりも安くなる損益分岐点を計算する。<br><strong>月額パス費用 ÷ 1回あたりの差額 ＝ ${breakevenTimes}回</strong>`,
                    `ステップ2：したがって、<strong>${correctAnswerVal}回以上</strong>利用する場合にプランBの方がお得になる。`
                ]
            };
        }

        function genDiscount3() {
            const original = getRandomInt(50, 100) * 100;
            const firstRate = [10, 20][getRandomInt(0, 1)];
            const intermediate = Math.round(original * (1 - firstRate / 100));
            const secondRate = [10, 20, 25][getRandomInt(0, 2)];
            const finalPrice = Math.round(intermediate * (1 - secondRate / 100));
            const totalDiscount = original - finalPrice;

            return {
                unit: '料金割引', level: 3, badge: 'Lv.3 高難度', title: '連続割引の計算',

// --- ⑤ 速さ Lv.1: 出会い算（基本） ---
function genSpeed1() {
    // 時間が整数（2〜5時間）になるよう逆算して距離を設定
    const hours = getRandomInt(2, 5);
    const speedA = getRandomInt(50, 80);
    const speedB = getRandomInt(30, 50);
    const sumSpeed = speedA + speedB;
    const distance = sumSpeed * hours;

    return {

        text: `${distance}km 離れた地点から、Aは時速 ${speedA}km、Bは時速 ${speedB}km で互いに向かって同時に出発した。`,
        prompt: '2人が出会うのは出発してから何時間後か。', 
        correctAnswer: hours, 
        unitSuffix: '時間後', 
        step: 1,
        steps: [
            `ステップ1：2人の合算の速さ（1時間に縮まる距離）を求める。<br><strong>${speedA}km/h + ${speedB}km/h = ${sumSpeed}km/h</strong>`,
            `ステップ2：全体の距離を合算の速さで割る。<br><strong>${distance}km ÷ ${sumSpeed}km/h = ${hours}時間後</strong>`
        ]

}

// --- ⑤ 速さ Lv.2: 旅人算（追いつき）＆ 平均の速さ ---
function genSpeed2() {
    const isCatchUp = Math.random() < 0.5;

    if (isCatchUp) {
        // 【パターンA】追いつき旅人算
        const diffMinutes = [10, 15, 20, 30][getRandomInt(0, 3)]; // 先発のリード時間（分）
        const speedWalk = 60; // 先発（徒歩）：分速60m
        const leadDistance = speedWalk * diffMinutes; // リードしている距離
        
        // 追いつく時間（10〜30分）
        const catchTime = [10, 15, 20, 30][getRandomInt(0, 3)]; 
        // 追いつくために必要な速さの差 = リード距離 ÷ 時間
        const speedDiff = leadDistance / catchTime;
        const speedRun = speedWalk + speedDiff; // 後発（自転車・走る）：分速

        return {
            unit: '速さ', level: 2, badge: 'Lv.2 応用', title: '追いつき旅人算',
            text: `Aが分速 ${speedWalk}m で出発した ${diffMinutes}分 後に、Bが同じ地点から分速 ${speedRun}m でAを追いかけた。`,
            prompt: 'Bが出発してから何分後にAに追いつくか。',
            correctAnswer: catchTime,
            unitSuffix: '分後',
            step: 1,
            steps: [
                `ステップ1：Bが出発するまでにAが進んだ距離（差）を求める。<br><strong>${speedWalk}m/分 × ${diffMinutes}分 = ${leadDistance}m</strong>`,
                `ステップ2：1分間にBがAとの距離を縮める速さ（差）を求める。<br><strong>${speedRun}m/分 - ${speedWalk}m/分 = ${speedDiff}m/分</strong>`,
                `ステップ3：追いつくのにかかる時間を求める。<br><strong>${leadDistance}m ÷ ${speedDiff}m/分 = ${catchTime}分後</strong>`
            ]
        };
    } else {
        // 【パターンB】往復の平均の速さ
        // 片道の距離（km）
        const distance = [60, 120, 180][getRandomInt(0, 2)];
        const speedGoing = 60; // 行き：時速60km
        const speedReturn = 40; // 帰り：時速40km
        
        const timeGoing = distance / speedGoing; // 行きの時間
        const timeReturn = distance / speedReturn; // 帰りの時間
        const totalDistance = distance * 2;
        const totalTime = timeGoing + timeReturn;
        
        // 平均の速さ = 全距離 ÷ 全時間 ( (60*40*2)/(60+40) = 48km/h )
        const avgSpeed = totalDistance / totalTime;

        return {
            unit: '速さ', level: 2, badge: 'Lv.2 応用', title: '往復の平均速度',
            text: `A地点とB地点の間（片道 ${distance}km）を往復した。行きは時速 ${speedGoing}km、帰りは時速 ${speedReturn}km で走った。`,
            prompt: '往復の平均の速さは時速何kmか。',
            correctAnswer: avgSpeed,
            unitSuffix: 'km/h',
            step: 1,
            steps: [
                `ステップ1：行きと帰りにかかる時間をそれぞれ求める。<br>行き：<strong>${distance}km ÷ ${speedGoing}km/h = ${timeGoing}時間</strong><br>帰り：<strong>${distance}km ÷ ${speedReturn}km/h = ${timeReturn}時間</strong>`,
                `ステップ2：往復の全距離と合計時間を求める。<br>全距離：<strong>${distance}km × 2 = ${totalDistance}km</strong><br>全時間：<strong>${timeGoing} + ${timeReturn} = ${totalTime}時間</strong>`,
                `ステップ3：全距離を全時間で割って平均速度を算出する。<br><strong>${totalDistance}km ÷ ${totalTime}時間 = ${avgSpeed}km/h</strong>`
            ]
        };
    }
}

// --- ⑤ 速さ Lv.3: 流水算 ＆ 通過算 ---
function genSpeed3() {
    const isRiver = Math.random() < 0.5;

    if (isRiver) {
        // 【パターンA】流水算（静水時の船速・川の流速）
        const streamSpeed = getRandomInt(2, 5); // 川の流速 (km/h)
        const boatSpeed = getRandomInt(12, 20); // 静水時の船速 (km/h)
        
        const downSpeed = boatSpeed + streamSpeed; // 下りの速さ
        const upSpeed = boatSpeed - streamSpeed;   // 上りの速さ
        
        // 整数時間（2〜4時間）で進める川の長さ
        const hours = getRandomInt(2, 4);
        const distance = downSpeed * hours; 
        
        // 問い：同じ距離を「上る」のにかかる時間を求める
        // 確実に割り切れる組み合わせを調整
        const upHours = distance / upSpeed;
        
        // もし上り時間が整数にならない場合はシンプルな数値を再固定
        const fixedBoat = 15;
        const fixedStream = 3;
        const fixedDown = 18; // 15 + 3
        const fixedUp = 12;   // 15 - 3
        const fixedDistance = 36; // 36km
        
        return {
            unit: '速さ', level: 3, badge: 'Lv.3 高難度', title: '流水算（川の上り下り）',
            text: `川に沿って ${fixedDistance}km 離れた2地点がある。静水での速さが時速 ${fixedBoat}km の船が、川を下るのに ${fixedDistance / fixedDown}時間 かかった。`,
            prompt: 'この船が同じ区間を上るのにかかる時間は何時間か。',
            correctAnswer: fixedDistance / fixedUp, // 3時間
            unitSuffix: '時間',
            step: 0.5,
            steps: [
                `ステップ1：川の下りの速さと、川の流速を求める。<br>下りの実質速さ：<strong>${fixedDistance}km ÷ ${fixedDistance / fixedDown}時間 = ${fixedDown}km/h</strong><br>川の流速：<strong>${fixedDown}km/h - ${fixedBoat}km/h = ${fixedStream}km/h</strong>`,
                `ステップ2：川の上りの実質速さを求める。<br><strong>${fixedBoat}km/h - ${fixedStream}km/h = ${fixedUp}km/h</strong>`,
                `ステップ3：上りにかかる時間を求める。<br><strong>${fixedDistance}km ÷ ${fixedUp}km/h = ${fixedDistance / fixedUp}時間</strong>`
            ]
        };
    } else {
        // 【パターンB】通過算（列車とトンネル）
        const trainLength = [100, 120, 150, 200][getRandomInt(0, 3)]; // 電車の長さ(m)
        const tunnelLength = [800, 1000, 1200][getRandomInt(0, 2)];   // トンネルの長さ(m)
        const totalDistance = trainLength + tunnelLength;             // 走るべき全距離(m)
        
        // 秒速 (m/s)：20m/s = 72km/h, 25m/s = 90km/h
        const speedMps = [20, 25][getRandomInt(0, 1)];
        const speedKmh = speedMps * 3.6;
        
        const seconds = totalDistance / speedMps; // かかる時間（秒）

        return {
            unit: '速さ', level: 3, badge: 'Lv.3 高難度', title: '通過算（列車とトンネル）',
            text: `長さ ${trainLength}m の列車が、時速 ${speedKmh}km（秒速 ${speedMps}m）で走り、長さ ${tunnelLength}m のトンネルに入り始めてから完全に抜け出るまで進む。`,
            prompt: 'トンネルを完全に抜け出るまでに何秒かかるか。',
            correctAnswer: seconds,
            unitSuffix: '秒',
            step: 1,
            steps: [
                `ステップ1：列車が完全に抜け出るまでに進む総距離を求める。<br><strong>トンネルの長さ ${tunnelLength}m + 列車の長さ ${trainLength}m = ${totalDistance}m</strong>`,
                `ステップ2：総距離を秒速で割って通過時間を計算する。<br><strong>${totalDistance}m ÷ ${speedMps}m/秒 = ${seconds}秒</strong>`
            ]
        };
    }
}

// --- ⑥ 損益算 Lv.2: 分割販売（定価販売＋割引販売） ---
function genProfit2() {
    // 1個あたりの原価（100円〜500円）
    const cost = getRandomInt(1, 5) * 100;
    
    // 見込み利益率（20%、30%、40%、50%）
    const markupRate = [20, 30, 40, 50][getRandomInt(0, 3)];
    const listPrice = Math.round(cost * (1 + markupRate / 100)); // 定価
    
    // 全体の仕入れ個数（100個）
    const totalCount = 100;
    const totalCost = cost * totalCount; // 総仕入れ額
    
    // 定価で売れた割合（60%〜80%）
    const regularRatio = [60, 70, 80][getRandomInt(0, 2)];
    const regularCount = totalCount * (regularRatio / 100);
    const discountCount = totalCount - regularCount;
    
    // 残りの割引率（10%引き、20%引き、30%引き）
    const discountRate = [10, 20, 30][getRandomInt(0, 2)];
    const discountPrice = Math.round(listPrice * (1 - discountRate / 100)); // 割引売価
    
    // 売上総額と利益の計算
    const salesRegular = listPrice * regularCount;
    const salesDiscount = discountPrice * discountCount;
    const totalSales = salesRegular + salesDiscount;
    const totalProfit = totalSales - totalCost;

    return {
        unit: '損益算', level: 2, badge: 'Lv.2 応用', title: '定価と割引での分割販売',
        text: `1個 ${cost.toLocaleString()}円 で仕入れた商品を ${totalCount}個 用意し、原価の ${markupRate}% の利益を見込んで定価をつけた。<br>` +
              `全体の ${regularRatio}%（${regularCount}個）は定価で売れ、残りの ${discountCount}個 は定価の ${discountRate}% 引きで販売した。`,
        prompt: 'この商品の販売による全体での利益額はいくらか。',
        correctAnswer: totalProfit,
        unitSuffix: '円',
        step: 100,
        steps: [
            `ステップ1：定価と割引売価をそれぞれ求める。<br>定価：<strong>${cost}円 × (1 + ${markupRate/100}) = ${listPrice.toLocaleString()}円</strong><br>割引売価：<strong>${listPrice}円 × (1 - ${discountRate/100}) = ${discountPrice.toLocaleString()}円</strong>`,
            `ステップ2：定価販売と割引販売の合計売上額を計算する。<br>定価売上：<strong>${listPrice.toLocaleString()}円 × ${regularCount}個 = ${salesRegular.toLocaleString()}円</strong><br>割引売上：<strong>${discountPrice.toLocaleString()}円 × ${discountCount}個 = ${salesDiscount.toLocaleString()}円</strong><br>売上総額：<strong>${totalSales.toLocaleString()}円</strong>`,
            `ステップ3：売上総額から総仕入れ額（原価）を引いて総利益を求める。<br>総仕入れ額：<strong>${cost}円 × ${totalCount}個 = ${totalCost.toLocaleString()}円</strong><br>利益：<strong>${totalSales.toLocaleString()}円 - ${totalCost.toLocaleString()}円 = ${totalProfit.toLocaleString()}円</strong>`
        ]
    };
}

// --- ⑥ 損益算 Lv.3: 目標利益率から処分価格の割引率を逆算 ---
function genProfit3() {
    // わかりやすく全体を100個として計算
    const totalCount = 100;
    
    // 定価で売れた割合（70%）
    const regularCount = 70;
    const discountCount = 30;
    
    // 定価の利益率（50%増し：原価の1.5倍）
    const markupRate = 50; 
    
    // 目標とする全体の利益率（例：26%、29%、32%など整数に収まる値を選択）
    // 定価で 70個 × 1.5 = 105 の売上。
    // 全体利益率 targetRate (%) のとき、必要な売上＝ 100 + targetRate
    // 割引分 30個 で必要な売上＝ (100 + targetRate) - 105 = targetRate - 5
    // 割引売価(原価比) = (targetRate - 5) / 30
    // これが「定価(1.5)」に対していくら引きか：
    // 例: targetRate = 26% の場合
    // 全体売上 126。定価売上 105。残り売上 21。
    // 割引売価 = 21 / 30 = 0.7 (原価の70%)
    // 定価(1.5)に対する割合 = 0.7 / 1.5 = 7/15 （非割り切り回避のため固定セットから抽選）

    // きれいに割り切れるパターン設定
    // 原価100、定価150（50%利益）
    // 70個定価売上 = 10,500円
    // パターン1: 割引率20%引き（売価120円） -> 30個売上3,600円 -> 総売上14,100円（原価10,000円） -> 全体利益41%
    // パターン2: 割引率30%引き（売価105円） -> 30個売上3,150円 -> 総売上13,650円（原価10,000円） -> 全体利益36.5%
    // パターン3: 割引率40%引き（売価90円）  -> 30個売上2,700円 -> 総売上13,200円（原価10,000円） -> 全体利益32%
    // パターン4: 割引率50%引き（売価75円）  -> 30個売上2,250円 -> 総売上12,750円（原価10,000円） -> 全体利益27.5%

    const patterns = [
        { targetProfitPercent: 41, discountRate: 20, discountPriceRatio: 1.2 },
        { targetProfitPercent: 32, discountRate: 40, discountPriceRatio: 0.9 }
    ];
    
    const selected = patterns[getRandomInt(0, patterns.length - 1)];

    return {
        unit: '損益算', level: 3, badge: 'Lv.3 高難度', title: '目標利益からの割引率の逆算',
        text: `ある商品を原価の ${markupRate}% の利益を見込んで定価をつけて販売した。<br>` +
              `仕入れた個数の ${regularCount}% が定価で売れたため、残りの ${discountCount}% を定価から一定の割合で割り引いてすべて売り切った。<br>` +
              `その結果、全体として仕入れ総額の ${selected.targetProfitPercent}% の利益を得ることができた。`,
        prompt: '売れ残りを定価の何%引きで販売したか。',
        correctAnswer: selected.discountRate,
        unitSuffix: '%引き',
        step: 5,
        steps: [
            `ステップ1：商品1個の原価を100とし、全体量を100個として計算する。<br>仕入れ総額：<strong>100 × 100 = 10,000</strong><br>定価：<strong>100 × (1 + 0.5) = 150</strong>`,
            `ステップ2：全体で得た売上目標額と、定価で売れた分の売上額を求める。<br>目標売上総額：<strong>10,000 × (1 + ${selected.targetProfitPercent/100}) = ${(10000 * (1 + selected.targetProfitPercent/100)).toLocaleString()}</strong><br>定価分の売上：<strong>150 × ${regularCount}個 = ${(150 * regularCount).toLocaleString()}</strong>`,
            `ステップ3：残りの ${discountCount}個 で必要な売上額と、その1個あたりの販売価格を求める。<br>残り分の売上額：<strong>${(10000 * (1 + selected.targetProfitPercent/100)).toLocaleString()} - ${(150 * regularCount).toLocaleString()} = ${(10000 * (1 + selected.targetProfitPercent/100) - 150 * regularCount).toLocaleString()}</strong><br>割引後の売価：<strong>${(10000 * (1 + selected.targetProfitPercent/100) - 150 * regularCount).toLocaleString()} ÷ ${discountCount}個 = ${100 * selected.discountPriceRatio}</strong>`,
            `ステップ4：定価（150）に対する割引率を算出する。<br><strong>(150 - ${100 * selected.discountPriceRatio}) ÷ 150 = ${selected.discountRate / 100} （${selected.discountRate}%引き）</strong>`
        ]

// --- ⑦ 場合の数・確率 Lv.1: 条件付き順列（隣り合い） ---
function genProbability1() {
    // 男子3人、女子2人の並び替え（女子2人が必ず隣り合う）
    // 男子: 3〜4人、女子: 2人で動的に生成
    const menCount = getRandomInt(3, 4);
    const womenCount = 2; // 女子2人は隣り合う
    const totalPeople = menCount + womenCount;

    // 計算ロジック: 女子2人を1グループとみなす -> (menCount + 1)! × 2!
    function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
    
    const groupCount = menCount + 1;
    const ways = factorial(groupCount) * factorial(womenCount);

    return {
        unit: '場合の数・確率', level: 1, badge: 'Lv.1 基本', title: '場合の数・特定要素の隣り合い',
        text: `男子 ${menCount}人 と女子 ${womenCount}人 の合計 ${totalPeople}人 が一列に並ぶ。`,
        prompt: '女子2人が必ず隣り合う並び方は何通りか。',
        correctAnswer: ways,
        unitSuffix: '通り',
        step: 12,
        steps: [
            `ステップ1：隣り合う女子2人を「1つのグループ」としてまとめる。<br>並べる対象は男子 ${menCount}人 ＋ 女子グループ1個 ＝ <strong>${groupCount}要素</strong>。`,
            `ステップ2：${groupCount}要素の並び方を計算する。<br><strong>${groupCount}! ＝ ${factorial(groupCount)}通り</strong>`,
            `ステップ3：女子グループ内での2人の並び替えを考慮する。<br><strong>2! ＝ 2通り</strong>`,
            `ステップ4：積の法則により全体を算出する。<br><strong>${factorial(groupCount)} × 2 ＝ ${ways}通り</strong>`
        ]
    };
}

            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(getRand() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuestionTimer() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            maxQuestionTime = 90;
            remainingQuestionTime = 90;

            const timerBar = document.getElementById('timer-bar');
            if (timerBar) {
                timerBar.style.width = '100%';
                timerBar.className = 'bg-indigo-500 h-full w-full transition-all duration-100 linear';
            }

            const startTime = Date.now();
            questionTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                remainingQuestionTime = Math.max(0, maxQuestionTime - elapsed);
                const percent = (remainingQuestionTime / maxQuestionTime) * 100;

                if (timerBar) {
                    timerBar.style.width = percent + '%';
                    if (percent < 25) {
                        timerBar.className = 'bg-rose-500 h-full w-full transition-all duration-100 linear';
                    } else if (percent < 50) {
                        timerBar.className = 'bg-amber-500 h-full w-full transition-all duration-100 linear';
                    }
                }

                if (remainingQuestionTime <= 0) {
                    clearInterval(questionTimerInterval);
                    if (!isAnswered) {
                        checkAnswer(null);
                    }
                }
            }, 100);
        }

        function startCBTOverallTimer() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);

            cbtOverallTimerInterval = setInterval(() => {
                cbtOverallRemainingTime--;

                const outerCircle = document.getElementById('cbt-circle-outer');
                if (outerCircle) {
                    const frac = cbtOverallRemainingTime / cbtMaxOverallTime;
                    outerCircle.style.strokeDashoffset = (314.16 * (1 - frac)).toString();
                }

                if (cbtOverallRemainingTime <= 0) {
                    clearInterval(cbtOverallTimerInterval);
                    finishCBTMode();
                }
            }, 1000);
        }

        function generateNewQuestion() {
            isAnswered = false;
            document.getElementById('explanation-card').classList.add('hidden');

            if (isCBTMode) {
                if (cbtQuestionIndex >= cbtTotalQuestions) {
                    finishCBTMode();
                    return;
                }
                cbtQuestionIndex++;
                updateCBTUI();
                
                const nextUnit = cbtUnitQueue.pop() || 'all';
                currentQuestion = generateQuestionByConfig(nextUnit, cbtCurrentLevel.toString());
            } else {
                currentQuestion = generateQuestionByConfig(configUnit, configLevel);
            }

            currentQuestion.choices = generateChoices(currentQuestion);

            const qMetaHeader = document.getElementById('q-meta-header');
            if (qMetaHeader) {
                if (isCBTMode) {
                    qMetaHeader.classList.add('hidden');
                } else {
                    qMetaHeader.classList.remove('hidden');
                }
            }

            document.getElementById('unit-badge').innerText = currentQuestion.unit;
            document.getElementById('q-badge').innerText = currentQuestion.badge;
            document.getElementById('q-pattern-title').innerText = currentQuestion.title;
            document.getElementById('q-text').innerHTML = currentQuestion.text;
            document.getElementById('q-prompt').innerText = currentQuestion.prompt;

            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            currentQuestion.choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] hover:bg-[#232c48] hover:border-indigo-500/50 text-slate-100 font-medium text-xs md:text-sm transition flex items-center justify-between text-left group shadow-sm';
                btn.onclick = () => selectChoice(idx);
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-xl bg-slate-800 border border-slate-700 text-indigo-300 font-bold flex items-center justify-center shrink-0 group-hover:border-indigo-500/50">
                            ${choice.label}
                        </span>
                        <span>${choice.htmlText}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-600 group-hover:text-indigo-400 transition"></i>
                `;
                container.appendChild(btn);
            });

            startQuestionTimer();
        }

        function selectChoice(idx) {
            if (isAnswered) return;
            const selectedChoice = currentQuestion.choices[idx];
            checkAnswer(selectedChoice);
        }

        function checkAnswer(selectedChoice) {
            isAnswered = true;
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            const isCorrect = selectedChoice ? selectedChoice.isCorrect : false;
            const correctChoice = currentQuestion.choices.find(c => c.isCorrect);

            totalCount++;
            if (isCorrect) correctCount++;

            if (isCBTMode) {
                if (isCorrect && cbtCurrentLevel < 3) {
                    cbtCurrentLevel++;
                } else if (!isCorrect && cbtCurrentLevel > 1) {
                    cbtCurrentLevel--;
                }
            }

            const ansRecord = {
                qIndex: isCBTMode ? cbtQuestionIndex : totalCount,
                unit: currentQuestion.unit,
                level: currentQuestion.level,
                question: currentQuestion.text,
                prompt: currentQuestion.prompt,
                userChoiceLabel: selectedChoice ? selectedChoice.label : '未解答',
                userChoiceText: selectedChoice ? selectedChoice.htmlText : '時間切れ',
                correctChoiceLabel: correctChoice ? correctChoice.label : '',
                correctChoiceText: correctChoice ? correctChoice.htmlText : '',
                isCorrect: isCorrect,
                steps: currentQuestion.steps
            };
            sessionAnswers.push(ansRecord);
            addGlobalHistory({ unit: currentQuestion.unit, prompt: currentQuestion.prompt, isCorrect: isCorrect });

            if (isCBTMode) {
                generateNewQuestion();
                return;
            }

            const container = document.getElementById('choices-container');
            const btns = container.querySelectorAll('.choice-btn');

            currentQuestion.choices.forEach((choice, idx) => {
                const btn = btns[idx];
                if (!btn) return;
                btn.disabled = true;

                if (choice.isCorrect) {
                    btn.className = 'p-3.5 rounded-2xl border-2 border-emerald-500 bg-emerald-950/40 text-emerald-200 font-bold text-xs md:text-sm flex items-center justify-between text-left shadow-lg';
                    btn.innerHTML += `<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>`;
                } else if (selectedChoice && choice.value === selectedChoice.value) {
                    btn.className = 'p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-950/40 text-rose-200 font-bold text-xs md:text-sm flex items-center justify-between text-left shadow-lg';
                    btn.innerHTML += `<i class="fa-solid fa-circle-xmark text-rose-400 text-base"></i>`;
                } else {
                    btn.className = 'p-3.5 rounded-2xl border border-slate-800 bg-[#121726] text-slate-500 text-xs md:text-sm opacity-50 flex items-center justify-between text-left';
                }
            });

            const banner = document.getElementById('result-banner');
            if (isCorrect) {
                banner.className = 'rounded-2xl p-4 mb-5 flex items-center space-x-3 bg-emerald-950/80 border border-emerald-500/40 text-emerald-200';
                banner.innerHTML = `<i class="fa-solid fa-circle-check text-2xl text-emerald-400 shrink-0"></i><div><h4 class="font-bold text-sm">正解！</h4><p class="text-xs text-emerald-300/80">素晴らしい解法アプローチです。</p></div>`;
            } else {
                banner.className = 'rounded-2xl p-4 mb-5 flex items-center space-x-3 bg-rose-950/80 border border-rose-500/40 text-rose-200';
                banner.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl text-rose-400 shrink-0"></i><div><h4 class="font-bold text-sm">${selectedChoice ? '不正解' : '時間切れ'}</h4><p class="text-xs text-rose-300/80">正解は ${correctChoice ? correctChoice.label + '（' + correctChoice.htmlText + '）' : ''} です。解説を確認しましょう。</p></div>`;
            }

            const expContent = document.getElementById('explanation-content');
            expContent.innerHTML = currentQuestion.steps.map(s => `<div class="p-3 bg-[#1b233a] rounded-xl border border-slate-800">${s}</div>`).join('');

            document.getElementById('explanation-card').classList.remove('hidden');
        }

        function startPracticeWithConfig() {
            initPRNG(null);
            isCBTMode = false;
            sessionAnswers = [];
            hideAllViews();
            updateActiveConfigBadge();
            document.getElementById('view-practice').classList.remove('hidden');
            const banner = document.getElementById('practice-config-banner');
            if (banner) banner.classList.remove('hidden');
            const changeBtn = document.getElementById('nav-change-config-btn');
            if (changeBtn) changeBtn.classList.remove('hidden');
            generateNewQuestion();
        }

        function openCBTModal() {
            document.getElementById('cbt-modal').classList.remove('hidden');
        }

        function closeCBTModal() {
            document.getElementById('cbt-modal').classList.add('hidden');
        }

        function toggleSyncDateSection() {
            const container = document.getElementById('sync-date-container');
            const picker = document.getElementById('sync-date-picker');
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                if (!picker.value) {
                    const today = new Date().toISOString().split('T')[0];
                    picker.value = today;
                }
            } else {
                container.classList.add('hidden');
            }
        }

        function startSyncCBTMode() {
            const dateVal = document.getElementById('sync-date-picker').value;
            if (!dateVal) {
                alert('日付を選択してください。');
                return;
            }
            startCBTMode('sync', dateVal);
        }

        function startCBTMode(type, syncDateStr = null) {
            closeCBTModal();
            isCBTMode = true;
            cbtModeType = type;
            cbtSyncDate = syncDateStr;

            const allUnits = ['set', 'settlement', 'discount', 'installment', 'speed', 'profit', 'probability', 'logical', 'table'];

            if (type === 'sync') {
                initPRNG(`CBT-SYNC-${syncDateStr}`);
                cbtTotalQuestions = 9;
                cbtMaxOverallTime = 720;
                cbtUnitQueue = shuffleArray([...allUnits]);
            } else if (type === 'mini') {
                initPRNG(null);
                cbtTotalQuestions = 9;
                cbtMaxOverallTime = 720;
                cbtUnitQueue = shuffleArray([...allUnits]);
            } else {
                initPRNG(null);
                cbtTotalQuestions = 20;
                cbtMaxOverallTime = 1200;
                cbtUnitQueue = shuffleArray([...allUnits, ...allUnits, allUnits[getRandomInt(0, 8)], allUnits[getRandomInt(0, 8)]]);
            }

            cbtOverallRemainingTime = cbtMaxOverallTime;
            cbtQuestionIndex = 0;
            cbtCurrentLevel = 1;
            sessionAnswers = [];

            hideAllViews();
            document.getElementById('cbt-status-bar').classList.remove('hidden');
            document.getElementById('view-practice').classList.remove('hidden');
            document.getElementById('practice-config-banner').classList.add('hidden');

            startCBTOverallTimer();
            generateNewQuestion();
        }

        function updateCBTUI() {
            const badge = document.getElementById('cbt-mode-badge');
            
            if (badge) {
                if (cbtModeType === 'sync') {
                    badge.className = 'px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full text-xs font-bold inline-flex items-center';
                    badge.innerHTML = `<i class="fa-solid fa-users mr-1.5"></i> 一斉テスト (${cbtSyncDate})`;
                } else if (cbtModeType === 'mini') {
                    badge.className = 'px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold inline-flex items-center';
                    badge.innerHTML = `<i class="fa-solid fa-laptop-code mr-1.5"></i> ミニテスト`;
                } else {
                    badge.className = 'px-2.5 py-0.5 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-full text-xs font-bold inline-flex items-center';
                    badge.innerHTML = `<i class="fa-solid fa-graduation-cap mr-1.5"></i> フル模擬試験`;
                }
            }

            const innerCircle = document.getElementById('cbt-circle-inner');
            if (innerCircle) {
                const frac = cbtQuestionIndex / cbtTotalQuestions;
                innerCircle.style.strokeDashoffset = (226.19 * (1 - frac)).toString();
            }
        }

        function exitCBTMode() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            goToLanding();
        }

        function finishCBTMode() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            hideAllViews();
            document.getElementById('cbt-result-card').classList.remove('hidden');

            const score = sessionAnswers.filter(a => a.isCorrect).length;
            const accuracy = sessionAnswers.length > 0 ? Math.round((score / sessionAnswers.length) * 100) : 0;

            document.getElementById('cbt-res-score').innerText = `${score} / ${cbtTotalQuestions}`;
            document.getElementById('cbt-res-accuracy').innerText = `${accuracy} %`;
            document.getElementById('cbt-res-final-lvl').innerText = `Lv.${cbtCurrentLevel}`;

            const syncDateDisplay = document.getElementById('cbt-sync-date-display');
            if (cbtSyncDate) {
                document.getElementById('cbt-res-date-val').innerText = cbtSyncDate;
                syncDateDisplay.classList.remove('hidden');
            } else {
                syncDateDisplay.classList.add('hidden');
            }
        }

        function copyCBTResult() {
            const score = sessionAnswers.filter(a => a.isCorrect).length;
            
            let dateStr = cbtSyncDate;
            if (!dateStr) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                dateStr = `${yyyy}-${mm}-${dd}`;
            }

            const textToCopy = `実施日：${dateStr}\n得点：${score} / ${cbtTotalQuestions}\n判定レベル：Lv.${cbtCurrentLevel}`;

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textarea);

            const btn = document.getElementById('copy-cbt-result-btn');
            if (btn) {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-300"></i><span>コピーしました！</span>`;
                btn.classList.add('ring-2', 'ring-emerald-400');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('ring-2', 'ring-emerald-400');
                }, 2000);
            }
        }

        function openReviewModal() {
            const list = document.getElementById('session-review-list');
            list.innerHTML = '';

            document.getElementById('review-count-info').innerText = `全 ${sessionAnswers.length} 問の履歴`;

            if (sessionAnswers.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">今回のセッションで解いた問題はありません。</div>`;
            } else {
                sessionAnswers.forEach((ans, idx) => {
                    const card = document.createElement('div');
                    card.className = 'bg-[#141a2e] p-4 rounded-2xl border border-slate-800 space-y-3 text-xs md:text-sm animate-fade-in shadow-md';
                    
                    const stepsHtml = ans.steps.map(s => `
                        <div class="p-2.5 bg-[#0f1423] rounded-xl border border-slate-800/80 text-slate-300 text-xs leading-relaxed mb-1.5">
                            ${s}
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex items-center justify-between pb-2 border-b border-slate-800/60">
                            <div class="flex items-center space-x-2">
                                <span class="${ans.isCorrect ? 'bg-emerald-950 text-emerald-400 border-emerald-800/60' : 'bg-rose-950 text-rose-400 border-rose-800/60'} px-2.5 py-0.5 rounded-md text-[11px] font-extrabold border">
                                    ${ans.isCorrect ? '正解' : '不正解'}
                                </span>
                                <span class="text-slate-400 text-xs font-semibold">${ans.unit} / Lv.${ans.level}</span>
                            </div>
                            <span class="text-slate-500 text-xs font-mono font-bold">#${ans.qIndex || (idx + 1)}</span>
                        </div>

                        <div class="text-slate-200 leading-relaxed font-medium">
                            ${ans.question}
                        </div>

                        <div class="bg-[#1b233a] border-l-2 border-indigo-500 p-2.5 rounded-r-xl font-semibold text-indigo-200 text-xs">
                            ${ans.prompt}
                        </div>

                        <div class="bg-[#0f1423] p-3 rounded-xl border border-slate-800 space-y-1.5">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-400">あなたの解答:</span>
                                <span class="${ans.isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                                    ${ans.userChoiceLabel ? ans.userChoiceLabel + ': ' : ''}${ans.userChoiceText}
                                </span>
                            </div>
                            <div class="flex justify-between items-center text-xs pt-1.5 border-t border-slate-800/60">
                                <span class="text-slate-400">正解:</span>
                                <span class="text-emerald-400 font-bold">
                                    ${ans.correctChoiceLabel ? ans.correctChoiceLabel + ': ' : ''}${ans.correctChoiceText}
                                </span>
                            </div>
                        </div>

                        <details class="group pt-1">
                            <summary class="cursor-pointer text-xs font-bold text-indigo-400 hover:text-indigo-300 flex items-center space-x-1 select-none transition">
                                <i class="fa-solid fa-caret-right group-open:rotate-90 transition-transform"></i>
                                <span>解説・ステップを表示</span>
                            </summary>
                            <div class="mt-2.5 pt-2 border-t border-slate-800/60 space-y-1">
                                ${stepsHtml}
                            </div>
                        </details>
                    `;
                    list.appendChild(card);
                });
            }

            document.getElementById('review-modal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        function openHistoryModal() {
            renderGlobalHistory();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function addGlobalHistory(item) {
            globalHistory.unshift(item);
            if (globalHistory.length > 10) globalHistory.pop();
        }

        function renderGlobalHistory() {
            const container = document.getElementById('global-history-list');
            container.innerHTML = '';

            if (globalHistory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">履歴がありません。</p>`;
                return;
            }

            globalHistory.forEach((h, i) => {
                const item = document.createElement('div');
                item.className = 'bg-[#1b233a] p-3 rounded-xl border border-slate-800 text-xs flex justify-between items-center';
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-300 mr-2">${h.unit}</span>
                        <span class="text-slate-400 truncate inline-block max-w-[180px] align-bottom">${h.prompt}</span>
                    </div>
                    <span class="${h.isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                        ${h.isCorrect ? '○' : '×'}
                    </span>
                `;
                container.appendChild(item);
            });
        }

        function clearGlobalHistory() {
            globalHistory = [];
            renderGlobalHistory();
        }

        function resetStats() {
            totalCount = 0;
            correctCount = 0;
            globalHistory = [];
            renderGlobalHistory();
        }

        window.onload = function() {
            goToLanding();
        };
    </script>
</body>
</html>
