<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI非言語分野 演習＆CBT模擬試験</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans JP', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        #explanation-content strong {
            color: #c7d2fe;
            font-weight: 700;
            background-color: rgba(99, 102, 241, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid rgba(129, 140, 248, 0.4);
            font-family: monospace, sans-serif;
            font-size: 0.9em;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-[#111827]/90 backdrop-blur-md text-white border-b border-slate-800/80 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <button onclick="goToLanding()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-3 rounded-xl text-xs transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-house text-indigo-400"></i>
                    <span class="hidden sm:inline">トップ</span>
                </button>
                
                <button id="nav-change-config-btn" onclick="goToSelectScreen()" class="hidden bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-200 border border-indigo-700/60 py-1.5 px-3 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>単元・レベル変更</span>
                </button>

                <button onclick="openReviewModal()" class="text-xs bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-700/60 py-1.5 px-3 rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>回答振り返り</span>
                </button>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-1.5 px-3 rounded-xl transition flex items-center space-x-1">
                    <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                    <span class="inline">履歴</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

        <!-- 1. LANDING VIEW -->
        <section id="view-landing" class="w-full animate-fade-in my-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-800 text-center max-w-lg mx-auto">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-4 border border-indigo-500/20">
                    <i class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white mb-2">SPI非言語問題 演習アプリ</h1>
                <p class="text-xs md:text-sm text-slate-400 mb-8 leading-relaxed">
                    単元とレベルを自由に組み合わせてじっくり演習・CBT模擬試験
                </p>

                <div class="space-y-4">
                    <button onclick="goToSelectScreen()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-indigo-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">通常 問題演習モード</h3>
                                <p class="text-[11px] text-indigo-200 font-normal">単元とレベルを選んで集中演習</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-indigo-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="openCBTModal()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-emerald-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">CBT 模擬試験モード</h3>
                                <p class="text-[11px] text-emerald-200 font-normal">本番形式の問題可変型テスト</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>

                <div class="mt-8 pt-5 border-t border-slate-800 flex justify-center items-center space-x-3">
                    <button onclick="openHistoryModal()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                        <span>学習履歴 (直近10回)</span>
                    </button>
                    <button onclick="resetStats()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>成績クリア</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. UNIT & LEVEL SELECT VIEW -->
        <section id="view-select" class="hidden w-full animate-fade-in max-w-xl mx-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 shadow-xl border border-slate-800">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-800">
                    <h2 class="text-lg font-extrabold text-white flex items-center">
                        <i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>単元・レベルの選択
                    </h2>
                    <span class="text-xs text-slate-400">ステップ 1/2</span>
                </div>

                <!-- Unit Choice Cards (8 Units) -->
                <div class="mb-6">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">演習する単元</label>
                    <div class="grid grid-cols-2 gap-2" id="unit-selection-grid">
                        <button onclick="selectConfigUnit('all')" data-unit="all" class="cfg-unit-btn p-3 rounded-2xl border text-left transition flex items-center space-x-2.5 bg-indigo-600 border-indigo-400 text-white font-bold">
                            <i class="fa-solid fa-layer-group text-base"></i>
                            <div>
                                <div class="text-xs font-bold">全単元 混合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('set')" data-unit="set" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-diagram-project text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">① 集合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('settlement')" data-unit="settlement" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-calculator text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">② 代金清算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('discount')" data-unit="discount" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-tags text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">③ 料金割引</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('installment')" data-unit="installment" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-credit-card text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">④ 分割払い</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('speed')" data-unit="speed" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-gauge-high text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑤ 速さ</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('profit')" data-unit="profit" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-coins text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑥ 損益算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('probability')" data-unit="probability" class="cfg-unit-btn p-3 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-slate-600">
                            <i class="fa-solid fa-dice text-indigo-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold">⑦ 場合の数・確率</div>
                            </div>
                        </button>
                        <!-- Added ⑧ 推論 Unit -->
                        <button onclick="selectConfigUnit('logical')" data-unit="logical" class="cfg-unit-btn col-span-2 p-3 rounded-2xl border border-indigo-500/50 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-2.5 hover:border-indigo-400">
                            <i class="fa-solid fa-brain text-amber-400 text-base"></i>
                            <div>
                                <div class="text-xs font-bold text-amber-300">⑧ 推論（論理命題・連鎖）</div>
                                <div class="text-[10px] text-slate-400 font-normal">包含・命題連鎖・分岐合流グラフ</div>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Level Choice Options -->
                <div class="mb-8">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">難易度（レベル）</label>
                    <div class="grid grid-cols-4 gap-2" id="level-selection-grid">
                        <button onclick="selectConfigLevel('all')" data-level="all" class="cfg-lvl-btn p-2.5 rounded-xl border border-indigo-400 bg-indigo-600 text-white text-xs font-bold text-center">
                            全レベル
                        </button>
                        <button onclick="selectConfigLevel('1')" data-level="1" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.1 基本
                        </button>
                        <button onclick="selectConfigLevel('2')" data-level="2" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.2 応用
                        </button>
                        <button onclick="selectConfigLevel('3')" data-level="3" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.3 高難度
                        </button>
                    </div>
                </div>

                <button onclick="startPracticeWithConfig()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-950/60 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>この条件で演習を始める</span>
                </button>
            </div>
        </section>

        <!-- 3. CBT MOCK EXAM DISPLAY -->
        <section id="cbt-status-bar" class="hidden mb-5 bg-[#141a2e] text-white rounded-3xl p-5 shadow-2xl border border-slate-800 max-w-2xl mx-auto w-full animate-fade-in">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                
                <div class="relative w-32 h-32 flex items-center justify-center shrink-0">
                    <svg class="w-full h-full" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="50" stroke="#1e293b" stroke-width="7" fill="transparent" />
                        <circle id="cbt-circle-outer" class="progress-ring-circle" cx="60" cy="60" r="50" 
                                stroke="#10b981" stroke-width="7" fill="transparent" 
                                stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="0" />
                        
                        <circle cx="60" cy="60" r="38" stroke="#1e293b" stroke-width="7" fill="transparent" />
                        <circle id="cbt-circle-inner" class="progress-ring-circle" cx="60" cy="60" r="38" 
                                stroke="#6366f1" stroke-width="7" fill="transparent" 
                                stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76" />
                    </svg>

                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span id="cbt-circle-qcount" class="text-sm font-extrabold text-indigo-300">1 / 10 問</span>
                    </div>
                </div>

                <div class="flex-grow text-center sm:text-left">
                    <div class="flex items-center justify-center sm:justify-start space-x-2">
                        <span id="cbt-mode-badge" class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold inline-flex items-center">
                            <i class="fa-solid fa-laptop-code mr-1.5"></i> ミニテスト
                        </span>
                        <span class="text-xs text-slate-400 font-medium">CBT模擬試験中</span>
                    </div>
                </div>

                <div class="shrink-0 w-full sm:w-auto">
                    <button onclick="exitCBTMode()" class="w-full sm:w-auto bg-slate-800/90 hover:bg-rose-950/50 hover:text-rose-300 text-slate-400 border border-slate-700/80 hover:border-rose-800/60 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-rectangle-xmark"></i>
                        <span>テスト中断</span>
                    </button>
                </div>

            </div>
        </section>

        <!-- 4. PRACTICE VIEW -->
        <section id="view-practice" class="hidden w-full animate-fade-in max-w-2xl mx-auto my-auto">
            
            <div id="practice-config-banner" class="mb-4 bg-[#141a2e] rounded-xl px-4 py-2.5 border border-slate-800 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">現在の設定:</span>
                    <span id="active-config-badge" class="px-2.5 py-0.5 rounded-md bg-indigo-950 text-indigo-300 font-bold border border-indigo-800/50">
                        全単元 / 全レベル
                    </span>
                </div>
                <button onclick="goToSelectScreen()" class="text-indigo-400 hover:text-indigo-300 font-bold flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-[10px]"></i>
                    <span>変更</span>
                </button>
            </div>

            <!-- Question Card -->
            <div id="question-card" class="bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 relative overflow-hidden mb-5">
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                    <div id="timer-bar" class="bg-indigo-500 h-full w-full transition-all duration-100 linear"></div>
                </div>

                <div id="q-meta-header" class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 text-xs">
                    <div class="flex items-center space-x-2">
                        <span id="unit-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-slate-800 text-slate-200 border border-slate-700">
                            単元
                        </span>
                        <span id="q-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                            Lv.1
                        </span>
                    </div>
                    <span id="q-pattern-title" class="text-slate-400 font-medium truncate max-w-[200px]">
                        パターン名
                    </span>
                </div>

                <div class="text-slate-100 text-sm md:text-base leading-relaxed font-medium mb-5" id="q-text">
                    問題を取得しています...
                </div>

                <div class="bg-[#1c243c] border-l-4 border-indigo-500 p-3.5 rounded-r-xl mb-5">
                    <p class="font-bold text-indigo-200 text-xs md:text-sm" id="q-prompt">
                        ---
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5" id="choices-container">
                    <!-- Choice Buttons dynamically rendered -->
                </div>
            </div>

            <!-- Explanation Card -->
            <div id="explanation-card" class="hidden bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 animate-fade-in mb-5">
                <div id="result-banner" class="rounded-2xl p-4 mb-5 flex items-center space-x-3">
                </div>

                <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center">
                    <i class="fa-solid fa-lightbulb text-amber-400 mr-2"></i>解法・解説ステップ
                </h3>

                <div class="space-y-3 text-xs md:text-sm text-slate-300 leading-relaxed mb-6" id="explanation-content">
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-end">
                    <button onclick="generateNewQuestion()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-indigo-950/50">
                        <span>次の問題に進む</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 5. CBT RESULT CARD VIEW -->
        <section id="cbt-result-card" class="hidden bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-xl border border-slate-800 max-w-2xl mx-auto w-full animate-fade-in">
            <div class="text-center pb-5 border-b border-slate-800 mb-6">
                <span class="px-3 py-1 bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 rounded-full text-xs font-bold">
                    CBT TEST RESULT
                </span>
                <h2 class="text-2xl font-extrabold text-white mt-2">CBT模擬試験 結果</h2>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解数</span>
                    <p class="text-xl font-black text-indigo-400" id="cbt-res-score">0 / 10</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解率</span>
                    <p class="text-xl font-black text-emerald-400" id="cbt-res-accuracy">0 %</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">到達レベル</span>
                    <p class="text-xl font-black text-purple-400" id="cbt-res-final-lvl">Lv.1</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="openReviewModal()" class="w-full py-3.5 rounded-2xl bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/60 font-bold transition text-xs shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-list-check"></i>
                    <span>回答振り返り</span>
                </button>
                <button onclick="goToLanding()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition text-xs shadow-lg">
                    トップ画面に戻る
                </button>
            </div>
        </section>

    </main>

    <!-- MODALS -->
    <!-- REVIEW MODAL -->
    <div id="review-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-3 md:p-4 animate-fade-in">
        <div class="bg-[#0f1423] rounded-3xl max-w-xl w-full p-4 md:p-6 shadow-2xl border border-slate-800 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800/80 mb-4">
                <h3 class="text-base font-extrabold text-white flex items-center">
                    <i class="fa-solid fa-list-check text-indigo-400 mr-2.5"></i>回答振り返り (今回のセッション)
                </h3>
                <button onclick="closeReviewModal()" class="text-slate-400 hover:text-slate-200 p-1.5 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

    <script>

        function updateActiveConfigBadge() {

                'all': '全単元', 'set': '①集合', 'settlement': '②代金清算',
                'discount': '③料金割引', 'installment': '④分割払い', 'speed': '⑤速さ',

            document.getElementById('view-practice').classList.remove('hidden');

        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // --- ⑧ 推論 (Logical Inference Generators) ---
        const logicalConcepts = [
            ['赤いボールペン', 'ボールペン', '筆記用具'],
            ['青いノート', 'ノート', '文房具'],
            ['柴犬', '犬', '動物'],
            ['トマト', '野菜', '食品'],
            ['りんご', '果物', '食品'],
            ['バラ', '花', '植物'],
            ['電子レンジ', '調理家電', '家電'],
            ['救急車', '緊急車両', '車両'],
            ['小説', '文学作品', '芸術作品'],
            ['サッカー選手', 'スポーツ選手', '職業'],
            ['公務員', '職業人', '社会人'],
            ['大学生', '学生', '学校関係者']
        ];

        const logicalPeople = [
            ['朝型の人', '規則正しい生活をする人', '健康管理を意識する人'],
            ['読書習慣のある人', '文章に触れる機会が多い人', '情報収集をする人'],
            ['資格試験の合格者', '試験で基準点を超えた人', '一定の能力を示した人'],
            ['自転車通勤をする人', '自転車を利用する人', '移動手段を持つ人']
        ];

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function logicalReachable(edges, from, to) {
            if (from === to) return true;
            const graph = {};
            edges.forEach(([a, b]) => {
                if (!graph[a]) graph[a] = [];
                graph[a].push(b);
            });
            const seen = new Set([from]);
            const queue = [from];
            while (queue.length) {
                const cur = queue.shift();
                for (const next of (graph[cur] || [])) {
                    if (next === to) return true;
                    if (!seen.has(next)) {
                        seen.add(next);
                        queue.push(next);
                    }
                }
            }
            return false;
        }

        function makeLogicalChoices(nodes, edges, correctPair, difficulty) {
            const allPairs = [];
            for (const from of nodes) {
                for (const to of nodes) {
                    if (from !== to) allPairs.push([from, to]);
                }
            }

            const correct = `${correctPair[0]}\u3000→\u3000${correctPair[1]}`;
            const invalidPairs = allPairs.filter(([a, b]) => !logicalReachable(edges, a, b));

            const distractors = shuffleArray(invalidPairs)
                .filter(([a, b]) => `${a}\u3000→\u3000${b}` !== correct)
                .slice(0, 4);

            const pairs = shuffleArray([correctPair, ...distractors]);
            return pairs.map((pair, i) => ({
                label: String.fromCharCode(65 + i),
                value: i,
                htmlText: `「${pair[0]}」ならば「${pair[1]}」といえる`,
                isCorrect: pair[0] === correctPair[0] && pair[1] === correctPair[1]
            }));
        }

        function buildLogicalQuestion(level, family, variant) {
            const base = family === 'concept'
                ? logicalConcepts[variant % logicalConcepts.length]
                : logicalPeople[variant % logicalPeople.length];

            const [A, B, C] = base;
            let nodes = [A, B, C];
            let edges = [[A, B], [B, C]];
            let premise;
            let correctPair;
            let title;

            if (level === 1) {
                const mode = variant % 3;
                if (mode === 0) {
                    premise = `ある対象について、次の関係が成り立つ。<br>・「${A}」であるものは「${B}」である。<br>・「${B}」であるものは「${C}」である。`;
                    correctPair = [A, B];
                    title = '直接推論';
                } else if (mode === 1) {
                    premise = `次の分類関係がある。<br>・「${A}」は「${B}」に含まれる。<br>・「${B}」は「${C}」に含まれる。`;
                    correctPair = [B, C];
                    title = '包含関係';
                } else {
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。`;
                    correctPair = [A, C];
                    title = '連鎖の基本';
                }
            } else if (level === 2) {
                const extra = family === 'concept'
                    ? ['高級な筆記具', '日用品', '公共交通機関', '専門職']
                    : ['計画的に行動する人', '目標達成を目指す人', '継続的に努力する人', '学習習慣のある人'];
                const D = extra[variant % extra.length];
                nodes = [A, B, C, D];
                const mode = variant % 4;
                if (mode === 0) {
                    edges = [[A, B], [B, C], [C, D]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${C}」ならば「${D}」である。`;
                    correctPair = [A, D];
                    title = '3段階の連鎖推論';
                } else if (mode === 1) {
                    edges = [[A, B], [A, C], [B, D], [C, D]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${A}」ならば「${C}」である。<br>・「${B}」ならば「${D}」である。<br>・「${C}」ならば「${D}」である。`;
                    correctPair = [A, D];
                    title = '分岐と合流';
                } else if (mode === 2) {
                    edges = [[A, B], [B, C], [D, C]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${D}」ならば「${C}」である。`;
                    correctPair = [A, C];
                    title = '共通結果からの推論';
                } else {
                    edges = [[A, B], [B, C], [C, D]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${C}」ならば「${D}」である。`;
                    correctPair = [B, D];
                    title = '中間命題からの推論';
                }
            } else {
                const extra1 = family === 'concept' ? '専門的な道具' : '高度な能力を示した人';
                const extra2 = family === 'concept' ? '特定分野で使われる道具' : '特定分野で活動する人';
                const extra3 = family === 'concept' ? '社会で利用されるもの' : '社会で役割を担う人';
                nodes = [A, B, C, extra1, extra2, extra3];
                const mode = variant % 5;
                if (mode === 0) {
                    edges = [[A, B], [B, C], [C, extra1], [extra1, extra2], [extra2, extra3]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${C}」ならば「${extra1}」である。<br>・「${extra1}」ならば「${extra2}」である。<br>・「${extra2}」ならば「${extra3}」である。`;
                    correctPair = [A, extra3];
                    title = '多段階連鎖推論';
                } else if (mode === 1) {
                    edges = [[A, B], [A, C], [B, extra1], [C, extra2], [extra1, extra3], [extra2, extra3]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${A}」ならば「${C}」である。<br>・「${B}」ならば「${extra1}」である。<br>・「${C}」ならば「${extra2}」である。<br>・「${extra1}」ならば「${extra3}」である。<br>・「${extra2}」ならば「${extra3}」である。`;
                    correctPair = [A, extra3];
                    title = '複数経路の合流';
                } else if (mode === 2) {
                    edges = [[A, B], [B, C], [extra1, C], [C, extra2], [extra2, extra3]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${extra1}」ならば「${C}」である。<br>・「${C}」ならば「${extra2}」である。<br>・「${extra2}」ならば「${extra3}」である。`;
                    correctPair = [A, extra3];
                    title = '共通条件を介した推論';
                } else if (mode === 3) {
                    edges = [[A, B], [B, C], [C, extra1], [extra1, extra3]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${C}」ならば「${extra1}」である。<br>・「${extra1}」ならば「${extra3}」である。<br>なお、逆向きの推論が常に成り立つとは限らない。`;
                    correctPair = [B, extra1];
                    title = '逆推論に注意する問題';
                } else {
                    edges = [[A, B], [B, C], [C, extra2], [extra1, extra2], [extra2, extra3]];
                    premise = `次の条件が成り立つ。<br>・「${A}」ならば「${B}」である。<br>・「${B}」ならば「${C}」である。<br>・「${C}」ならば「${extra2}」である。<br>・「${extra1}」ならば「${extra2}」である。<br>・「${extra2}」ならば「${extra3}」である。`;
                    correctPair = [A, extra3];
                    title = '条件の組合せ';
                }
            }

            const choices = makeLogicalChoices(nodes, edges, correctPair, level);
            const answerIndex = choices.findIndex(c => c.isCorrect);
            const answerLabel = choices[answerIndex].label;

            return {
                unit: '推論', level,
                badge: `Lv.${level} ${level === 1 ? '基本' : level === 2 ? '応用' : '高難度'}`,
                title,
                text: premise,
                prompt: '次の推論のうち、論理的に必ず正しいものはどれか。',
                customChoices: choices,
                correctAnswer: answerIndex,
                unitSuffix: '', step: 1,
                steps: [
                    `ステップ1：条件を矢印で整理すると、${edges.map(e => `「${e[0]}」→「${e[1]}」`).join('、')}となる。`,
                    `ステップ2：「${correctPair[0]}」から「${correctPair[1]}」へは条件を順にたどることができるため、この推論は必ず正しい。`,
                    `ステップ3：逆向きの推論や、条件にない関係を推測することはできない。正解は <strong>${answerLabel}</strong>。`
                ]
            };
        }

        function genSet1() {
            const total = getRandomInt(40, 80);
            const neither = getRandomInt(5, 15);
            const atLeastOne = total - neither;
            const both = getRandomInt(5, Math.floor(atLeastOne / 2));
            const englishOnly = getRandomInt(10, Math.max(11, atLeastOne - both - 5));
            const mathOnly = Math.max(1, atLeastOne - both - englishOnly);
            const passEnglish = englishOnly + both;
            const passMath = mathOnly + both;

            return {
                unit: '集合', level: 1, badge: 'Lv.1 基本', title: '2集合のベン図基本',
                text: `あるクラス ${total}人に英語と数学の試験を行ったところ、英語の合格者は ${passEnglish}人、数学の合格者は ${passMath}人 であった。また、両方とも不合格だった人は ${neither}人 であった。`,
                prompt: '両方とも合格した人は何人か。', correctAnswer: both, unitSuffix: '人', step: 1,
                steps: [
                    `ステップ1：全体 (${total}人) から両方不合格者 (${neither}人) を引き、少なくとも1方に合格した人数を求める。<br><strong>${total} - ${neither} = ${atLeastOne}人</strong>`,
                    `ステップ2：(英語合格者) + (数学合格者) の合格延べ人数を計算する。<br><strong>${passEnglish} + ${passMath} = ${passEnglish + passMath}人</strong>`,
                    `ステップ3：延べ人数から実人数を引いて重複（両方合格）を算出する。<br><strong>${passEnglish + passMath} - ${atLeastOne} = ${both}人</strong>`
                ]
            };
        }

        function genSet2() {
            const bothAll = getRandomInt(2, 5);
            const abOnly = getRandomInt(3, 8);
            const bcOnly = getRandomInt(3, 8);
            const caOnly = getRandomInt(3, 8);
            const aOnly = getRandomInt(10, 20);
            const bOnly = getRandomInt(10, 20);
            const cOnly = getRandomInt(10, 20);
            
            const abBoth = abOnly + bothAll;
            const bcBoth = bcOnly + bothAll;
            const caBoth = caOnly + bothAll;
            
            const hasA = aOnly + abOnly + caOnly + bothAll;
            const hasB = bOnly + abOnly + bcOnly + bothAll;
            const hasC = cOnly + bcOnly + caOnly + bothAll;
            
            const union = aOnly + bOnly + cOnly + abOnly + bcOnly + caOnly + bothAll;
            const neither = getRandomInt(10, 20);
            const total = union + neither;

            return {
                unit: '集合', level: 2, badge: 'Lv.2 応用', title: '3集合のベン図基本',
                text: `学生 ${total}人にA、B、Cの3つの資格の保有状況を調査した。<br>` +
                      `・Aの保有者: ${hasA}人、Bの保有者: ${hasB}人、Cの保有者: ${hasC}人<br>` +
                      `・AとBの両方: ${abBoth}人、BとCの両方: ${bcBoth}人、CとAの両方: ${caBoth}人<br>` +
                      `・3つとも保有している人: ${bothAll}人`,
                prompt: 'いずれの資格も保有していない人は何人か。', 
                correctAnswer: neither, unitSuffix: '人', step: 1,
                steps: [
                    `ステップ1：3集合の和の公式を用いて、少なくとも1つの資格を持つ人数を求める。<br><strong>(A + B + C) - (A∩B + B∩C + C∩A) + (A∩B∩C)</strong>`,
                    `ステップ2：数値を代入して計算する。<br><strong>(${hasA} + ${hasB} + ${hasC}) - (${abBoth} + ${bcBoth} + ${caBoth}) + ${bothAll} = ${union}人</strong>`,
                    `ステップ3：全体 (${total}人) から少なくとも1つを持つ人数 (${union}人) を引く。<br><strong>${total} - ${union} = ${neither}人</strong>`
                ]
            };
        }

        function genSet3() {
            const total = getRandomInt(6, 10) * 10;
            const neither = getRandomInt(1, 3) * 5;
            const union = total - neither;
            const minBoth = getRandomInt(1, 3) * 5; 
            const sumLikes = union + minBoth;
            const likeA = getRandomInt(Math.ceil(sumLikes / 2), sumLikes - 10);
            const likeB = sumLikes - likeA;
            const maxBoth = Math.min(likeA, likeB);

            const isMinQuestion = Math.random() < 0.5;
            const promptText = isMinQuestion ? '両方とも好きな人の「最小人数」は何人か。' : '両方とも好きな人の「最大人数」は何人か。';
            const correctAnswerVal = isMinQuestion ? minBoth : maxBoth;

            return {
                unit: '集合', level: 3, badge: 'Lv.3 高難度', title: '両方該当する人数の範囲（極値）',
                text: `${total}人の学生に映画Aと映画Bの好き嫌いを調査したところ、映画Aが好きな人は ${likeA}人、映画Bが好きな人は ${likeB}人 であった。また、どちらも好きではない人は ${neither}人 であった。`,
                prompt: promptText, correctAnswer: correctAnswerVal, unitSuffix: '人', step: 5,
                steps: [
                    `ステップ1：少なくとも一方が好きな人数（和集合）を求める。<br><strong>${total}人 - ${neither}人 = ${union}人</strong>`,
                    `ステップ2：AとBの合計人数を求める。<br><strong>${likeA}人 + ${likeB}人 = ${likeA + likeB}人</strong>`,
                    isMinQuestion
                        ? `ステップ3【最小値】：重なりが最も小さくなるのは全体に広がったとき。<br><strong>${likeA + likeB}人 - ${union}人 = ${minBoth}人</strong>`
                        : `ステップ3【最大値】：重なりが最も大きくなるのは人数が少ない方が含まれるとき。<br><strong>${likeB}人</strong>`
                ]
            };
        }

        function genSettlement1() {
            const priceA = getRandomInt(5, 15) * 100;
            const priceB = getRandomInt(3, 9) * 100;
            const countA = getRandomInt(2, 5);
            const countB = getRandomInt(2, 5);
            const total = priceA * countA + priceB * countB;
            const perPerson = Math.round(total / 4);

            return {
                unit: '代金清算', level: 1, badge: 'Lv.1 基本', title: '割り勘の基本計算',
                text: `4人で食事に行き、Aが ${priceA.toLocaleString()}円 の料理を ${countA}皿、Bが ${priceB.toLocaleString()}円 の料理を ${countB}皿 注文し、全員で均等に割り勘することにした。`,
                prompt: '1人あたりいくら支払うか。', correctAnswer: perPerson, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：全体の代金を計算する。<br><strong>(${priceA.toLocaleString()} × ${countA}) + (${priceB.toLocaleString()} × ${countB}) = ${total.toLocaleString()}円</strong>`,
                    `ステップ2：4人で均等に割る。<br><strong>${total.toLocaleString()} ÷ 4 = ${perPerson.toLocaleString()}円</strong>`
                ]
            };
        }

        function genDiscount1() {
            const rate = [10, 20, 25, 30, 40, 50][getRandomInt(0, 5)];
            const original = getRandomInt(20, 90) * 100;
            const discounted = Math.round(original * (1 - rate / 100));

            return {
                unit: '料金割引', level: 1, badge: 'Lv.1 基本', title: '定価の割引計算',
                text: `定価 ${original.toLocaleString()}円 の商品が、セールで ${rate}% 引きで販売されている。`,
                prompt: '割引後の販売価格はいくらか。', correctAnswer: discounted, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：割引後価格の割合を掛ける。<br><strong>${original.toLocaleString()} × (1 - ${rate/100}) = ${discounted.toLocaleString()}円</strong>`
                ]
            };
        }

        function genInstallment1() {
            const months = [6, 10, 12][getRandomInt(0, 2)];
            const monthly = getRandomInt(5, 15) * 1000;
            const rest = monthly * months;
            const first = getRandomInt(1, 3) * 10000;
            const total = rest + first;

            return {
                unit: '分割払い', level: 1, badge: 'Lv.1 基本', title: '頭金と均等分割払い',
                text: `総額 ${total.toLocaleString()}円 の商品を購入する際、最初に頭金として ${first.toLocaleString()}円 を支払い、残りを ${months}ヶ月 で均等に分割して支払うことになった。`,
                prompt: '毎月の支払額はいくらか。', correctAnswer: monthly, unitSuffix: '円', step: 1000,
                steps: [
                    `ステップ1：残金（分割対象）を求める。<br><strong>${total.toLocaleString()}円 - ${first.toLocaleString()}円 = ${rest.toLocaleString()}円</strong>`,
                    `ステップ2：分割回数で割る。<br><strong>${rest.toLocaleString()}円 ÷ ${months} = ${monthly.toLocaleString()}円</strong>`
                ]
            };
        }

        function genSpeed1() {
            const hours = getRandomInt(2, 5);
            const speedA = getRandomInt(50, 80);
            const speedB = getRandomInt(30, 50);
            const sumSpeed = speedA + speedB;
            const distance = sumSpeed * hours;

            return {
                unit: '速さ', level: 1, badge: 'Lv.1 基本', title: '出会い算の基本',
                text: `${distance}km 離れた地点から、Aは時速 ${speedA}km、Bは時速 ${speedB}km で互いに向かって同時に出発した。`,
                prompt: '2人が出会うのは出発してから何時間後か。', correctAnswer: hours, unitSuffix: '時間後', step: 1,
                steps: [
                    `ステップ1：速さの和を求める。<br><strong>${speedA}km/h + ${speedB}km/h = ${sumSpeed}km/h</strong>`,
                    `ステップ2：距離を速さの和で割る。<br><strong>${distance}km ÷ ${sumSpeed}km/h = ${hours}時間後</strong>`
                ]
            };
        }

        function genProfit1() {
            const cost = getRandomInt(1000, 5000);
            const markup = [20, 25, 30, 40][getRandomInt(0, 3)];
            const price = Math.round(cost * (1 + markup / 100));

            return {
                unit: '損益算', level: 1, badge: 'Lv.1 基本', title: '原価と定価・利益',
                text: `ある品物に原価の ${markup}% の利益を見込んで定価をつけることにした。`,
                prompt: `原価が ${cost.toLocaleString()}円 のとき、定価はいくらになるか。`, correctAnswer: price, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：定価を計算する。<br><strong>${cost.toLocaleString()}円 × (1 + ${markup/100}) = ${price.toLocaleString()}円</strong>`
                ]
            };
        }

        function genProbability1() {
            const menCount = getRandomInt(3, 4);
            const womenCount = 2;
            const totalPeople = menCount + womenCount;
            function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
            const ways = factorial(menCount + 1) * factorial(womenCount);

            return {
                unit: '場合の数・確率', level: 1, badge: 'Lv.1 基本', title: '場合の数・特定要素の隣り合い',
                text: `男子 ${menCount}人 と女子 ${womenCount}人 の合計 ${totalPeople}人 が一列に並ぶ。`,
                prompt: '女子2人が必ず隣り合う並び方は何通りか。',
                correctAnswer: ways, unitSuffix: '通り', step: 12,
                steps: [
                    `ステップ1：女子2人を1つの塊として並べる。<br><strong>(${menCount} + 1)! = ${factorial(menCount + 1)}通り</strong>`,
                    `ステップ2：女子の並び替え（2通り）を掛ける。<br><strong>${factorial(menCount + 1)} × 2 = ${ways}通り</strong>`
                ]
            };
        }

        function generateChoices(q) {
            if (q.customChoices) return q.customChoices;

            const correctVal = q.correctAnswer;
            const unitSuffix = q.unitSuffix || '';
            const step = q.step || 1;

            let pool = new Set();
            pool.add(correctVal);

            let attempts = 0;
            while (pool.size < 5 && attempts < 100) {
                attempts++;
                const offset = (getRandomInt(1, 4) * (Math.random() < 0.5 ? 1 : -1)) * step;
                const candidate = correctVal + offset;
                if (candidate > 0) pool.add(candidate);
            }

            const arr = Array.from(pool).sort((a, b) => a - b);
            return arr.map((val, idx) => ({
                label: String.fromCharCode(65 + idx),
                value: val,
                htmlText: `${val.toLocaleString()} ${unitSuffix}`,
                isCorrect: val === correctVal
            }));
        }

        function generateQuestionByConfig(unit, level) {
            // Unit router
            let selectedUnit = unit;
            if (unit === 'all') {
                const units = ['set', 'settlement', 'discount', 'installment', 'speed', 'profit', 'probability', 'logical'];
                selectedUnit = units[getRandomInt(0, units.length - 1)];
            }

            let targetLvl = level === 'all' ? getRandomInt(1, 3) : parseInt(level);

            if (selectedUnit === 'logical') {
                const family = Math.random() < 0.5 ? 'concept' : 'person';
                return buildLogicalQuestion(targetLvl, family, getRandomInt(0, 999));
            } else if (selectedUnit === 'set') {
                if (targetLvl === 1) return genSet1();
                if (targetLvl === 2) return genSet2();
                return genSet3();
            } else if (selectedUnit === 'settlement') {
                return genSettlement1();
            } else if (selectedUnit === 'discount') {
                return genDiscount1();
            } else if (selectedUnit === 'installment') {
                return genInstallment1();
            } else if (selectedUnit === 'speed') {
                return genSpeed1();
            } else if (selectedUnit === 'profit') {
                return genProfit1();
            } else {
                return genProbability1();
            }
        }

        function startQuestionTimer() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            remainingQuestionTime = maxQuestionTime;

            const timerBar = document.getElementById('timer-bar');
            if (timerBar) {
                timerBar.style.width = '100%';
                timerBar.className = 'bg-indigo-500 h-full w-full transition-all duration-100 linear';
            }

            const startTime = Date.now();
            questionTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                remainingQuestionTime = Math.max(0, maxQuestionTime - elapsed);
                const percent = (remainingQuestionTime / maxQuestionTime) * 100;

                if (timerBar) {
                    timerBar.style.width = percent + '%';
                    if (percent < 25) {
                        timerBar.className = 'bg-rose-500 h-full w-full transition-all duration-100 linear';
                    } else if (percent < 50) {
                        timerBar.className = 'bg-amber-500 h-full w-full transition-all duration-100 linear';
                    }
                }

                if (remainingQuestionTime <= 0) {
                    clearInterval(questionTimerInterval);
                    if (!isAnswered) handleTimeOut();
                }
            }, 100);
        }

        function generateNewQuestion() {
            isAnswered = false;
            document.getElementById('explanation-card').classList.add('hidden');

            if (isCBTMode) {
                if (cbtQuestionIndex >= cbtTotalQuestions) {
                    finishCBTMode();
                    return;
                }
                cbtQuestionIndex++;
                currentQuestion = generateQuestionByConfig('all', cbtCurrentLevel.toString());
                updateCBTUI();
            } else {
                currentQuestion = generateQuestionByConfig(configUnit, configLevel);
            }

            document.getElementById('unit-badge').innerText = currentQuestion.unit;
            document.getElementById('q-badge').innerText = currentQuestion.badge;
            document.getElementById('q-pattern-title').innerText = currentQuestion.title;
            document.getElementById('q-text').innerHTML = currentQuestion.text;
            document.getElementById('q-prompt').innerText = currentQuestion.prompt;

            const choices = generateChoices(currentQuestion);
            currentQuestion.renderedChoices = choices;

            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] hover:bg-[#232c48] hover:border-indigo-500/50 text-slate-200 text-xs md:text-sm font-semibold transition flex items-center justify-between group';
                btn.onclick = () => checkAnswer(idx);
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 text-indigo-300 font-bold flex items-center justify-center shrink-0 border border-slate-700 group-hover:border-indigo-500">${c.label}</span>
                        <span>${c.htmlText}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-500 group-hover:text-indigo-400"></i>
                `;
                container.appendChild(btn);
            });

            startQuestionTimer();
        }

        function checkAnswer(chosenIndex) {
            if (isAnswered) return;
            isAnswered = true;
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            const choice = currentQuestion.renderedChoices[chosenIndex];
            const isCorrect = choice.isCorrect;

            totalCount++;
            if (isCorrect) {
                correctCount++;
                if (isCBTMode) cbtCurrentLevel = Math.min(3, cbtCurrentLevel + 1);
            } else {
                if (isCBTMode) cbtCurrentLevel = Math.max(1, cbtCurrentLevel - 1);
            }

            // Save history
            const ansRecord = {
                question: currentQuestion.text,
                prompt: currentQuestion.prompt,
                userChoice: choice.htmlText,
                isCorrect,
                unit: currentQuestion.unit,
                level: currentQuestion.level,
                steps: currentQuestion.steps
            };
            sessionAnswers.push(ansRecord);
            addGlobalHistory(ansRecord);

            // CBTモードの場合は1問ごとの正誤判定・解説表示を行わず、直ちに次の問題へ遷移
            if (isCBTMode) {
                generateNewQuestion();
                return;
            }

            // 通常モードのみ: Render result banner & explanation
            const banner = document.getElementById('result-banner');
            if (isCorrect) {
                banner.className = 'rounded-2xl p-4 mb-5 flex items-center space-x-3 bg-emerald-950/80 border border-emerald-800/60 text-emerald-200';
                banner.innerHTML = `<i class="fa-solid fa-circle-check text-2xl text-emerald-400"></i><div><h4 class="font-bold text-sm">正解です！</h4><p class="text-xs text-emerald-300">素晴らしい着眼点です。</p></div>`;
            } else {
                banner.className = 'rounded-2xl p-4 mb-5 flex items-center space-x-3 bg-rose-950/80 border border-rose-800/60 text-rose-200';
                banner.innerHTML = `<i class="fa-solid fa-circle-xmark text-2xl text-rose-400"></i><div><h4 class="font-bold text-sm">不正解です</h4><p class="text-xs text-rose-300">下の解説で手順を確認しましょう。</p></div>`;
            }

            // Render explanation steps
            const expContent = document.getElementById('explanation-content');
            expContent.innerHTML = currentQuestion.steps.map(s => `<div class="p-3 bg-[#1b233a] rounded-xl border border-slate-800">${s}</div>`).join('');

            document.getElementById('explanation-card').classList.remove('hidden');
        }

        function handleTimeOut() {
            if (isAnswered) return;
            isAnswered = true;
            totalCount++;

            const ansRecord = {
                question: currentQuestion.text,
                prompt: currentQuestion.prompt,
                userChoice: '（未回答 / 時間切れ）',
                isCorrect: false,
                unit: currentQuestion.unit,
                level: currentQuestion.level,
                steps: currentQuestion.steps
            };
            sessionAnswers.push(ansRecord);
            addGlobalHistory(ansRecord);

            // CBTモードの場合は時間切れ時も解説を表示せず次の問題へ
            if (isCBTMode) {
                cbtCurrentLevel = Math.max(1, cbtCurrentLevel - 1);
                generateNewQuestion();
                return;
            }

            const banner = document.getElementById('result-banner');
            banner.className = 'rounded-2xl p-4 mb-5 flex items-center space-x-3 bg-amber-950/80 border border-amber-800/60 text-amber-200';
            banner.innerHTML = `<i class="fa-solid fa-clock text-2xl text-amber-400"></i><div><h4 class="font-bold text-sm">時間切れ</h4><p class="text-xs text-amber-300">制限時間内に回答できませんでした。</p></div>`;

            const expContent = document.getElementById('explanation-content');
            expContent.innerHTML = currentQuestion.steps.map(s => `<div class="p-3 bg-[#1b233a] rounded-xl border border-slate-800">${s}</div>`).join('');

            document.getElementById('explanation-card').classList.remove('hidden');
        }

        function openCBTModal() {
            document.getElementById('cbt-modal').classList.remove('hidden');
        }

        function closeCBTModal() {
            document.getElementById('cbt-modal').classList.add('hidden');
        }

        function startCBTMode(type) {
            closeCBTModal();
            isCBTMode = true;
            cbtModeType = type;
            cbtTotalQuestions = type === 'mini' ? 10 : 20;
            cbtMaxOverallTime = type === 'mini' ? 900 : 1800;
            cbtOverallRemainingTime = cbtMaxOverallTime;
            cbtQuestionIndex = 0;
            cbtCurrentLevel = 1;
            sessionAnswers = [];

            hideAllViews();
            document.getElementById('cbt-status-bar').classList.remove('hidden');
            document.getElementById('view-practice').classList.remove('hidden');
            document.getElementById('practice-config-banner').classList.add('hidden');

            startCBTOverallTimer();
            generateNewQuestion();
        }

        function startCBTOverallTimer() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            const startTime = Date.now();
            cbtOverallTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                cbtOverallRemainingTime = Math.max(0, cbtMaxOverallTime - elapsed);

                const outerCircle = document.getElementById('cbt-circle-outer');
                if (outerCircle) {
                    const frac = cbtOverallRemainingTime / cbtMaxOverallTime;
                    outerCircle.style.strokeDashoffset = (314.16 * (1 - frac)).toString();
                }

                if (cbtOverallRemainingTime <= 0) {
                    clearInterval(cbtOverallTimerInterval);
                    finishCBTMode();
                }
            }, 500);
        }

        function updateCBTUI() {
            document.getElementById('cbt-circle-qcount').innerText = `${cbtQuestionIndex} / ${cbtTotalQuestions} 問`;
            const innerCircle = document.getElementById('cbt-circle-inner');
            if (innerCircle) {
                const frac = cbtQuestionIndex / cbtTotalQuestions;
                innerCircle.style.strokeDashoffset = (238.76 * (1 - frac)).toString();
            }
        }

        function exitCBTMode() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            goToLanding();
        }

        function finishCBTMode() {
            if (cbtOverallTimerInterval) clearInterval(cbtOverallTimerInterval);
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            hideAllViews();
            document.getElementById('cbt-result-card').classList.remove('hidden');

            const score = sessionAnswers.filter(a => a.isCorrect).length;
            const accuracy = sessionAnswers.length > 0 ? Math.round((score / sessionAnswers.length) * 100) : 0;

            document.getElementById('cbt-res-score').innerText = `${score} / ${cbtTotalQuestions}`;
            document.getElementById('cbt-res-accuracy').innerText = `${accuracy} %`;
            document.getElementById('cbt-res-final-lvl').innerText = `Lv.${cbtCurrentLevel}`;
        }

        function openReviewModal() {
            const list = document.getElementById('session-review-list');
            list.innerHTML = '';

            document.getElementById('review-count-info').innerText = `全 ${sessionAnswers.length} 問の履歴`;

            if (sessionAnswers.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">今回のセッションで解いた問題はありません。</div>`;
            } else {
                sessionAnswers.forEach((ans, idx) => {
                    const card = document.createElement('div');
                    card.className = 'bg-[#182035] p-4 rounded-2xl border border-slate-800 space-y-2 text-xs';
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-0.5 rounded font-bold bg-slate-800 text-indigo-300 text-[10px]">第 ${idx + 1} 問 - ${ans.unit} (Lv.${ans.level})</span>
                            <span class="${ans.isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                                <i class="fa-solid ${ans.isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1"></i>${ans.isCorrect ? '正解' : '不正解'}
                            </span>
                        </div>
                        <p class="text-slate-200">${ans.question}</p>
                        <div class="text-slate-400">回答: <span class="text-white font-semibold">${ans.userChoice}</span></div>
                    `;
                    list.appendChild(card);
                });
            }

            document.getElementById('review-modal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        function openHistoryModal() {
            renderGlobalHistory();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function addGlobalHistory(item) {
            globalHistory.unshift(item);
            if (globalHistory.length > 10) globalHistory.pop();
        }

        function renderGlobalHistory() {
            const container = document.getElementById('global-history-list');
            container.innerHTML = '';

            if (globalHistory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">履歴がありません。</p>`;
                return;
            }

            globalHistory.forEach((h, i) => {
                const item = document.createElement('div');
                item.className = 'bg-[#1b233a] p-3 rounded-xl border border-slate-800 text-xs flex justify-between items-center';
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-300 mr-2">${h.unit}</span>
                        <span class="text-slate-400 truncate inline-block max-w-[180px] align-bottom">${h.prompt}</span>
                    </div>
                    <span class="${h.isCorrect ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                        ${h.isCorrect ? '○' : '×'}
                    </span>
                `;
                container.appendChild(item);
            });
        }

        function clearGlobalHistory() {
            globalHistory = [];
            renderGlobalHistory();
        }

        function resetStats() {
            totalCount = 0;
            correctCount = 0;
            globalHistory = [];
            alert('成績と履歴をリセットしました。');
        }

        window.onload = function() {
            // Initialize
            goToLanding();
        };
    </script>
</body>
