<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI非言語分野 問題演習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans JP', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-[#111827]/90 backdrop-blur-md text-white border-b border-slate-800/80 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <button onclick="goToLanding()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-1.5 px-3 rounded-xl text-xs transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-house text-indigo-400"></i>
                    <span class="hidden sm:inline">トップ</span>
                </button>
                
                <!-- Practice view back button -->
                <button id="nav-change-config-btn" onclick="goToSelectScreen()" class="hidden bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-200 border border-indigo-700/60 py-1.5 px-3 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>単元・レベル変更</span>
                </button>

                <!-- Review Button (Moved next to top/nav buttons) -->
                <button onclick="openReviewModal()" class="text-xs bg-indigo-950/80 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-700/60 py-1.5 px-3 rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>回答振り返り</span>
                </button>
            </div>
            <div class="flex items-center space-x-3">
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block -mb-1">正解率</span>
                <span class="text-xs md:text-sm font-bold text-teal-400" id="stat-accuracy">0 % (0/0)</span>
            </div>
            <button onclick="openHistoryModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 py-1.5 px-2.5 rounded-xl transition flex items-center space-x-1">
                <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                <span class="hidden sm:inline">履歴</span>
            </button>
        </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

        <!-- 1. LANDING VIEW (トップ画面) -->
        <section id="view-landing" class="w-full animate-fade-in my-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-800 text-center max-w-lg mx-auto">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-4 border border-indigo-500/20">
                    <i class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white mb-2">SPI非言語問題 演習アプリ</h1>
                <p class="text-xs md:text-sm text-slate-400 mb-8 leading-relaxed">
                    単元とレベルを自由に組み合わせてじっくり演習・CBT模擬試験
                </p>

                <div class="space-y-4">
                    <button onclick="goToSelectScreen()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-indigo-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">通常 問題演習モード</h3>
                                <p class="text-[11px] text-indigo-200 font-normal">単元とレベルを選んで集中演習</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-indigo-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>

                    <button onclick="openCBTModal()" class="w-full p-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold transition flex items-center justify-between group shadow-lg shadow-emerald-950/50">
                        <div class="flex items-center space-x-3 text-left">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid fa-laptop-code"></i>
                            </div>
                            <div>
                                <h3 class="text-sm md:text-base font-bold">CBT 模擬試験モード</h3>
                                <p class="text-[11px] text-emerald-200 font-normal">本番形式の問題可変型テスト</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>

                <div class="mt-8 pt-5 border-t border-slate-800 flex justify-center items-center space-x-3">
                    <button onclick="openHistoryModal()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-clock-rotate-left text-teal-400"></i>
                        <span>学習履歴 (直近10回)</span>
                    </button>
                    <button onclick="resetStats()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>成績クリア</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. UNIT & LEVEL SELECT VIEW (単元・レベル選択専用画面) -->
        <section id="view-select" class="hidden w-full animate-fade-in max-w-xl mx-auto">
            <div class="bg-[#141a2e] rounded-3xl p-6 shadow-xl border border-slate-800">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-800">
                    <h2 class="text-lg font-extrabold text-white flex items-center">
                        <i class="fa-solid fa-sliders text-indigo-400 mr-2"></i>単元・レベルの選択
                    </h2>
                    <span class="text-xs text-slate-400">ステップ 1/2</span>
                </div>

                <!-- Unit Choice Cards -->
                <div class="mb-6">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">演習する単元</label>
                    <div class="grid grid-cols-2 gap-2" id="unit-selection-grid">
                        <button onclick="selectConfigUnit('all')" data-unit="all" class="cfg-unit-btn p-3.5 rounded-2xl border text-left transition flex items-center space-x-3 bg-indigo-600 border-indigo-400 text-white font-bold">
                            <i class="fa-solid fa-layer-group text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">全単元 混合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('set')" data-unit="set" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-diagram-project text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">① 集合</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('settlement')" data-unit="settlement" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-calculator text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">② 代金清算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('discount')" data-unit="discount" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-tags text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">③ 料金割引</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('installment')" data-unit="installment" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-credit-card text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">④ 分割払い</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('speed')" data-unit="speed" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-gauge-high text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">⑤ 速さ</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('profit')" data-unit="profit" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-coins text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">⑥ 損益算</div>
                            </div>
                        </button>
                        <button onclick="selectConfigUnit('probability')" data-unit="probability" class="cfg-unit-btn p-3.5 rounded-2xl border border-slate-700 bg-[#1b233a] text-slate-300 text-left transition flex items-center space-x-3 hover:border-slate-600">
                            <i class="fa-solid fa-dice text-indigo-400 text-lg"></i>
                            <div>
                                <div class="text-xs font-bold">⑦ 場合の数・確率</div>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Level Choice Options -->
                <div class="mb-8">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2.5">難易度（レベル）</label>
                    <div class="grid grid-cols-4 gap-2" id="level-selection-grid">
                        <button onclick="selectConfigLevel('all')" data-level="all" class="cfg-lvl-btn p-2.5 rounded-xl border border-indigo-400 bg-indigo-600 text-white text-xs font-bold text-center">
                            全レベル
                        </button>
                        <button onclick="selectConfigLevel('1')" data-level="1" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.1 基本
                        </button>
                        <button onclick="selectConfigLevel('2')" data-level="2" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.2 応用
                        </button>
                        <button onclick="selectConfigLevel('3')" data-level="3" class="cfg-lvl-btn p-2.5 rounded-xl border border-slate-700 bg-[#1b233a] text-slate-300 text-xs font-bold text-center hover:border-slate-600">
                            Lv.3 高難度
                        </button>
                    </div>
                </div>

                <!-- Submit Button to Start Practice -->
                <button onclick="startPracticeWithConfig()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm shadow-lg shadow-indigo-950/60 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>この条件で演習を始める</span>
                </button>
            </div>
        </section>

        <!-- 3. PRACTICE VIEW (問題演習専用画面) -->
        <section id="view-practice" class="hidden w-full animate-fade-in max-w-2xl mx-auto my-auto">
            
            <!-- Current Status Banner (Hide in CBT Mode) -->
            <div id="practice-config-banner" class="mb-4 bg-[#141a2e] rounded-xl px-4 py-2.5 border border-slate-800 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400">現在の設定:</span>
                    <span id="active-config-badge" class="px-2.5 py-0.5 rounded-md bg-indigo-950 text-indigo-300 font-bold border border-indigo-800/50">
                        全単元 / 全レベル
                    </span>
                </div>
                <button onclick="goToSelectScreen()" class="text-indigo-400 hover:text-indigo-300 font-bold flex items-center space-x-1">
                    <i class="fa-solid fa-pen-to-square text-[10px]"></i>
                    <span>変更</span>
                </button>
            </div>

            <!-- Question Card -->
            <div id="question-card" class="bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 relative overflow-hidden mb-5">
                <!-- Smooth Timer Bar -->
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                    <div id="timer-bar" class="bg-indigo-500 h-full w-full transition-all duration-100 linear"></div>
                </div>

                <!-- Meta Header (Hidden in CBT Mode) -->
                <div id="q-meta-header" class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4 text-xs">
                    <div class="flex items-center space-x-2">
                        <span id="unit-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-slate-800 text-slate-200 border border-slate-700">
                            単元
                        </span>
                        <span id="q-badge" class="px-2.5 py-0.5 rounded-full font-bold bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                            Lv.1
                        </span>
                    </div>
                    <span id="q-pattern-title" class="text-slate-400 font-medium truncate max-w-[180px]">
                        パターン名
                    </span>
                </div>

                <!-- Problem Text -->
                <div class="text-slate-100 text-sm md:text-base leading-relaxed font-medium mb-5" id="q-text">
                    問題を取得しています...
                </div>

                <!-- Prompt Highlight Box -->
                <div class="bg-[#1c243c] border-l-4 border-indigo-500 p-3.5 rounded-r-xl mb-5">
                    <p class="font-bold text-indigo-200 text-xs md:text-sm" id="q-prompt">
                        ---
                    </p>
                </div>

                <!-- Choices Container -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5" id="choices-container">
                    <!-- Choice Buttons dynamically rendered -->
                </div>
            </div>

            <!-- Explanation Card (Appears after answer) -->
            <div id="explanation-card" class="hidden bg-[#141a2e] rounded-3xl p-5 md:p-7 shadow-xl border border-slate-800 animate-fade-in mb-5">
                <div id="result-banner" class="rounded-2xl p-4 mb-5 flex items-center space-x-3">
                    <!-- Correct/Incorrect alert -->
                </div>

                <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center">
                    <i class="fa-solid fa-lightbulb text-amber-400 mr-2"></i>解法・解説ステップ
                </h3>

                <div class="space-y-3 text-xs md:text-sm text-slate-300 leading-relaxed mb-6" id="explanation-content">
                    <!-- Steps -->
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-end">
                    <button onclick="generateNewQuestion()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-indigo-950/50">
                        <span>次の問題に進む</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. CBT MOCK EXAM STATUS & RESULT VIEWS -->
        <section id="cbt-status-bar" class="hidden mb-4 bg-[#141a2e] text-white rounded-2xl p-4 shadow-lg border border-slate-800 max-w-2xl mx-auto w-full">
            <div class="flex items-center justify-between mb-2">
                <span id="cbt-mode-badge" class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-bold">
                    <i class="fa-solid fa-laptop-code mr-1"></i> ミニテスト
                </span>
                <span id="cbt-progress-text" class="text-xs font-bold text-slate-200">第 1 / 10 問</span>
                <button onclick="exitCBTMode()" class="text-xs text-slate-400 hover:text-rose-400 transition">
                    中断
                </button>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="cbt-overall-timer-bar" class="bg-teal-400 h-full w-full transition-all duration-1000 linear"></div>
            </div>
        </section>

        <section id="cbt-result-card" class="hidden bg-[#141a2e] rounded-3xl p-6 md:p-8 shadow-xl border border-slate-800 max-w-2xl mx-auto w-full animate-fade-in">
            <div class="text-center pb-5 border-b border-slate-800 mb-6">
                <span class="px-3 py-1 bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 rounded-full text-xs font-bold">
                    CBT TEST RESULT
                </span>
                <h2 class="text-2xl font-extrabold text-white mt-2">CBT模擬試験 結果</h2>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解数</span>
                    <p class="text-xl font-black text-indigo-400" id="cbt-res-score">0 / 10</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">正解率</span>
                    <p class="text-xl font-black text-emerald-400" id="cbt-res-accuracy">0 %</p>
                </div>
                <div class="bg-[#1b233a] p-3.5 rounded-2xl border border-slate-800 text-center">
                    <span class="text-[10px] font-bold text-slate-400 block mb-0.5">到達レベル</span>
                    <p class="text-xl font-black text-purple-400" id="cbt-res-final-lvl">Lv.1</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="openReviewModal()" class="w-full py-3.5 rounded-2xl bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-700/60 font-bold transition text-xs shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-list-check"></i>
                    <span>回答振り返り</span>
                </button>
                <button onclick="goToLanding()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition text-xs shadow-lg">
                    トップ画面に戻る
                </button>
            </div>
        </section>

    </main>

    <!-- Modals (History & CBT Mode Select & Review Modal) -->
    <div id="review-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[#141a2e] rounded-3xl max-w-lg w-full p-5 shadow-2xl border border-slate-700 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <h3 class="text-base font-extrabold text-white flex items-center">
                    <i class="fa-solid fa-list-check text-indigo-400 mr-2"></i>回答振り返り (今回のセッション)
                </h3>
                <button onclick="closeReviewModal()" class="text-slate-400 hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div class="overflow-y-auto space-y-3 flex-grow pr-1" id="session-review-list"></div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                <span class="text-xs text-slate-400" id="review-count-info">全 0 問</span>
                <button onclick="closeReviewModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 px-5 rounded-xl transition shadow-md">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[#141a2e] rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-700 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <h3 class="text-base font-extrabold text-white flex items-center">
                    <i class="fa-solid fa-clock-rotate-left text-teal-400 mr-2"></i>直近10回の履歴
                </h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div class="overflow-y-auto space-y-2 flex-grow pr-1" id="global-history-list"></div>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                <button onclick="clearGlobalHistory()" class="text-xs text-rose-400 hover:text-rose-300">
                    <i class="fa-solid fa-trash mr-1"></i>全消去
                </button>
                <button onclick="closeHistoryModal()" class="bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-xl border border-slate-700">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <div id="cbt-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-[#141a2e] rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-700">
            <div class="flex justify-between items-center mb-3">

function genSet2() {
    // 1. 各項目の人数を生成
    const bothAll = getRandomInt(2, 5); // 3つとも該当する人数 (A ∩ B ∩ C)
    
    // 2項目のみ該当する人数
    const abOnly = getRandomInt(3, 8);
    const bcOnly = getRandomInt(3, 8);
    const caOnly = getRandomInt(3, 8);
    
    // 1項目のみ該当する人数
    const aOnly = getRandomInt(10, 20);
    const bOnly = getRandomInt(10, 20);
    const cOnly = getRandomInt(10, 20);
    
    // 2集合の重複人数（問題文で提示する値）
    const abBoth = abOnly + bothAll; // AとBの両方
    const bcBoth = bcOnly + bothAll; // BとCの両方
    const caBoth = caOnly + bothAll; // CとAの両方
    
    // 各項目の合計人数（問題文で提示する値）
    const hasA = aOnly + abOnly + caOnly + bothAll;
    const hasB = bOnly + abOnly + bcOnly + bothAll;
    const hasC = cOnly + bcOnly + caOnly + bothAll;
    
    // 少なくとも1つに該当する人数 (A ∪ B ∪ C)
    const union = aOnly + bOnly + cOnly + abOnly + bcOnly + caOnly + bothAll;
    
    // いずれにも該当しない人数（10〜20人程度）
    const neither = getRandomInt(10, 20);
    
    // 全体人数
    const total = union + neither;

    return {
        unit: '集合', level: 2, badge: 'Lv.2 応用', title: '3集合のベン図基本',
        text: `学生 ${total}人にA、B、Cの3つの資格の保有状況を調査した。<br>` +
              `・Aの保有者: ${hasA}人、Bの保有者: ${hasB}人、Cの保有者: ${hasC}人<br>` +
              `・AとBの両方: ${abBoth}人、BとCの両方: ${bcBoth}人、CとAの両方: ${caBoth}人<br>` +
              `・3つとも保有している人: ${bothAll}人`,
        prompt: 'いずれの資格も保有していない人は何人か。', 
        correctAnswer: neither, 
        unitSuffix: '人', 
        step: 1,
        steps: [
            `ステップ1：3集合の和の公式を用いて、少なくとも1つの資格を持つ人数を求める。<br>` +
            `<strong>(A + B + C) - (A∩B + B∩C + C∩A) + (A∩B∩C)</strong>`,
            `ステップ2：数値を代入して計算する。<br>` +
            `<strong>(${hasA} + ${hasB} + ${hasC}) - (${abBoth} + ${bcBoth} + ${caBoth}) + ${bothAll} = ${union}人</strong>`,
            `ステップ3：全体 (${total}人) から少なくとも1つを持つ人数 (${union}人) を引く。<br>` +
            `<strong>${total} - ${union} = ${neither}人</strong>`
        ]
    };
}
function genSet3() {
    // 1. 全体人数（60〜100人の10の倍数）
    const total = getRandomInt(6, 10) * 10;
    
    // 2. どちらも嫌いな人（全体の5〜15%程度）
    const neither = getRandomInt(1, 3) * 5;
    
    // 少なくことも一方が好きな人の総数 (A ∪ B)
    const union = total - neither;
    
    // 3. Aが好き、Bが好きな人数を生成（合計が union より大きくなるように設定）
    // 両方の最小値(min)が 5人以上 になるように調整
    const minBoth = getRandomInt(1, 3) * 5; 
    const sumLikes = union + minBoth; // A + B の合計値
    
    // AとBの人数を分配（A >= B となるように設定）
    const likeA = getRandomInt(Math.ceil(sumLikes / 2), sumLikes - 10);
    const likeB = sumLikes - likeA;
    
    // 最大値(max)は、人数の少ない方の集合(likeB)に完全に包摂される場合
    const maxBoth = Math.min(likeA, likeB);

    // 質問パターンをランダムで決定（0: 最小値、1: 最大値）
    const isMinQuestion = Math.random() < 0.5;
    const promptText = isMinQuestion ? '両方とも好きな人の「最小人数」は何人か。' : '両方とも好きな人の「最大人数」は何人か。';
    const correctAnswerVal = isMinQuestion ? minBoth : maxBoth;

    return {
        unit: '集合', level: 3, badge: 'Lv.3 高難度', title: '両方該当する人数の範囲（極値）',
        text: `${total}人の学生に映画Aと映画Bの好き嫌いを調査したところ、映画Aが好きな人は ${likeA}人、映画Bが好きな人は ${likeB}人 であった。また、どちらも好きではない人は ${neither}人 であった。`,
        prompt: promptText, 
        correctAnswer: correctAnswerVal, 
        unitSuffix: '人', 
        step: 5,
        steps: [
            `ステップ1：少なくとも一方が好きな人数（和集合）を求める。<br><strong>${total}人 - ${neither}人 = ${union}人</strong>`,
            `ステップ2：AとBの合計人数を求める。<br><strong>${likeA}人 + ${likeB}人 = ${likeA + likeB}人</strong>`,
            isMinQuestion
                ? `ステップ3【最小値】：重なり（両方好き）が最も小さくなるのは、全体（${union}人）いっぱいに広がったとき。<br><strong>${likeA + likeB}人 - ${union}人 = ${minBoth}人（最小人数）</strong>`
                : `ステップ3【最大値】：重なり（両方好き）が最も大きくなるのは、人数の少ない方（${likeB}人）が全員もう一方（${likeA}人）に含まれるとき。<br><strong>${likeB}人（最大人数）</strong>`
        ]
    };
}

        // --- ② 代金清算 (Settlement Generators) ---
        function genSettlement1() {

// --- ② 代金清算 Lv.2: 複数立替えと最終移動金額 ---
function genSettlement2() {
    // 割り勘の1人あたり支払額（100円単位）
    const perPerson = getRandomInt(10, 30) * 100;
    const total = perPerson * 3; // 3人分の総額

    // P, Q, Rの立替額を生成（合計が total になるように調整）
    // Pの立替額を平均より多めにする
    const paidP = getRandomInt(Math.floor(perPerson / 100) + 5, Math.floor(total / 100) - 5) * 100;
    const remaining = total - paidP;
    
    // QとRで残りを分配
    const paidQ = getRandomInt(1, Math.floor(remaining / 100) - 1) * 100;
    const paidR = remaining - paidQ;

    // Pの過不足額（支払うべき金額は perPerson）
    // paidP > perPerson なので P は受け取る側になる
    const receiveP = paidP - perPerson;
    
    // QとRの過不足額（正なら過払い＝受け取り、負なら不足＝支払い）
    const diffQ = paidQ - perPerson;
    const diffR = paidR - perPerson;

    // 問題の問い：最も多く不足している人（払う側）から P への支払額を問う
    // QまたはRのうち、立替額が少ない方（不足額が大きい方）を支払い主とする
    let payerName = 'Q';
    let payerDiff = Math.abs(diffQ);
    if (diffR < diffQ) {
        payerName = 'R';
        payerDiff = Math.abs(diffR);
    }

    return {
        unit: '代金清算', level: 2, badge: 'Lv.2 応用', title: '複数人の立替えと精算',
        text: `P、Q、Rの3人がドライブに行き、かかった費用 ${total.toLocaleString()}円 を等しく分担することにした。` +
              `立替額は、Pが ${paidP.toLocaleString()}円、Qが ${paidQ.toLocaleString()}円、Rが ${paidR.toLocaleString()}円 であった。`,
        prompt: `${payerName} は P にいくら支払えば清算が完了するか。`,
        correctAnswer: payerDiff,
        unitSuffix: '円',
        step: 100,
        steps: [
            `ステップ1：1人あたりの本来の負担額を計算する。<br><strong>${total.toLocaleString()}円 ÷ 3 = ${perPerson.toLocaleString()}円</strong>`,
            `ステップ2：Pの受け取るべき金額（受給額）を求める。<br><strong>${paidP.toLocaleString()}円 - ${perPerson.toLocaleString()}円 = ${receiveP.toLocaleString()}円（受け取る）</strong>`,
            `ステップ3：${payerName} の不足額（支払うべき金額）を求める。<br><strong>${perPerson.toLocaleString()}円 - ${(payerName === 'Q' ? paidQ : paidR).toLocaleString()}円 = ${payerDiff.toLocaleString()}円</strong>`
        ]
    };
}

// --- ② 代金清算 Lv.3: 共同費用＋個人買い物の混ざった精算 ---
function genSettlement3() {
    // 共同費用（全体の割り勘代金）：3で割り切れる100円単位
    const sharedPerPerson = getRandomInt(15, 35) * 100;
    const sharedTotal = sharedPerPerson * 3;

    // Aの個人的な買い物代金（Aのみ負担）
    const personalA = getRandomInt(5, 15) * 100;

    // 店での会計総額＝共同費用 ＋ Aの個人買い物
    const totalReceipt = sharedTotal + personalA;

    // 会計時、Bがまとめて全額 (totalReceipt) を立て替えて支払った
    const paidB = totalReceipt;

    // Aが最終的にBへ支払うべき金額＝(共同費用の1人分) ＋ (自分の個人買い物代)
    const payAtoB = sharedPerPerson + personalA;

    return {
        unit: '代金清算', level: 3, badge: 'Lv.3 高難度', title: '共同費用と個人立替の複合清算',
        text: `A、B、Cの3人で旅行に行き、レンタカー代などの共同費用 ${sharedTotal.toLocaleString()}円 がかかった。` +
              `また、途中でAが個人で買い物をした代金 ${personalA.toLocaleString()}円 も含め、会計総額 ${totalReceipt.toLocaleString()}円 をBがまとめて支払った。` +
              `共同費用は3人で均等に割るものとする。`,
        prompt: 'AはBにいくら支払えばよいか。',
        correctAnswer: payAtoB,
        unitSuffix: '円',
        step: 100,
        steps: [
            `ステップ1：共同費用の1人あたりの負担額を求める。<br><strong>${sharedTotal.toLocaleString()}円 ÷ 3 = ${sharedPerPerson.toLocaleString()}円</strong>`,
            `ステップ2：Aが負担すべき総額（共同分 ＋ 個人購入分）を求める。<br><strong>${sharedPerPerson.toLocaleString()}円 + ${personalA.toLocaleString()}円 = ${payAtoB.toLocaleString()}円</strong>`,
            `ステップ3：Bが全額立て替えているため、Aは負担総額である <strong>${payAtoB.toLocaleString()}円</strong> を直接Bに支払う。`
        ]
    };
}

        // --- ③ 料金割引 (Discount Generators) ---
        function genDiscount1() {
            const rate = [10, 20, 25, 30, 40, 50][getRandomInt(0, 5)];
            // 定価が100円単位で、かつ割引後の価格も必ず整数（円）になるようにする
            // 割引後の価格 = original * (1 - rate/100) が整数になるため、originalは 100 の倍数にする
            const original = getRandomInt(20, 90) * 100;
            const discounted = Math.round(original * (1 - rate / 100));
            const discountAmount = original - discounted;

            return {
                unit: '料金割引', level: 1, badge: 'Lv.1 基本', title: '定価の割引計算',
                text: `定価 ${original.toLocaleString()}円 の商品が、セールで ${rate}% 引きで販売されている。`,
                prompt: '割引後の販売価格はいくらか。', correctAnswer: discounted, unitSuffix: '円', step: 100,
                steps: [
                    `ステップ1：割引額を求める。<br><strong>${original.toLocaleString()} × ${rate / 100} = ${discountAmount.toLocaleString()}円</strong>`,
                    `ステップ2：定価から割引額を引く。<br><strong>${original.toLocaleString()} - ${discountAmount.toLocaleString()} = ${discounted.toLocaleString()}円</strong>`
                ]
            };
        }
// --- ③ 料金割引 Lv.2: 複数プランの条件比較（損益分岐点） ---
function genDiscount2() {
    // 1回の利用料金（100円単位）
    const basePrice = getRandomInt(4, 8) * 100;
    
    // プランA: 会員割引（例：20%引き、30%引きなど）
    const discountRate = [20, 25, 30, 50][getRandomInt(0, 3)];
    const planAPrice = Math.round(basePrice * (1 - discountRate / 100)); // 会員利用料
    
    // プランB: 定額パス（月額固定＋1回利用料が0円）
    // ちょうど 3回〜6回 で元が取れるような月額費用を設定
    const breakevenTimes = getRandomInt(3, 6); 
    
    // 通常料金(basePrice)と会員料金(planAPrice)の差額 × 回数 で定額パスの元が取れる金額を算出
    const diffPrice = basePrice - planAPrice; // 1回あたりの割引お得額
    const passFee = diffPrice * breakevenTimes;

    // 問い：プランB（パス）を利用した方がプランA（会員割引）より「安くなる」最低回数を求める
    // breakevenTimes 回だと同額になるため、安くなるのは breakevenTimes + 1 回目
    const correctAnswerVal = breakevenTimes + 1;

    return {

// --- ③ 料金割引 Lv.3: 段階的・階段状割引（一定数量超過分のみ割引） ---
function genDiscount3() {
    // 基本単価（1個あたり100円〜300円）
    const unitPrice = getRandomInt(2, 6) * 50;
    
    // 基準となる個数（例: 10個、20個）
    const baseCount = [10, 15, 20][getRandomInt(0, 2)];
    
    // 超過分の割引率（20%引き、30%引き、50%引き）
    const discountRate = [20, 30, 50][getRandomInt(0, 2)];
    const discountedUnitPrice = Math.round(unitPrice * (1 - discountRate / 100));
    
    // 購入する全体の個数（基準個数 ＋ 5〜15個超過）
    const extraCount = getRandomInt(5, 15);
    const totalCount = baseCount + extraCount;

    // 金額計算
    const baseTotal = unitPrice * baseCount; // 基準部分の合計
    const extraTotal = discountedUnitPrice * extraCount; // 超過部分の合計
    const totalPrice = baseTotal + extraTotal;

    return {
        unit: '料金割引', level: 3, badge: 'Lv.3 高難度', title: '超過分に適用される段階割引',
        text: `ある商品は1個 ${unitPrice.toLocaleString()}円 で販売されているが、${baseCount}個 を超えて購入する場合、` +
              `${baseCount}個を超えた分についてのみ 1個あたり ${discountRate}% 引き になる割引ルールがある。`,
        prompt: `この商品を ${totalCount}個 購入したときの支払総額はいくらか。`,
        correctAnswer: totalPrice,
        unitSuffix: '円',
        step: 100,
        steps: [
            `ステップ1：定価で購入する分（最初の${baseCount}個）の金額を計算する。<br><strong>${unitPrice.toLocaleString()}円 × ${baseCount}個 = ${baseTotal.toLocaleString()}円</strong>`,
            `ステップ2：割引が適用される超過分の個数と、割引後の単価を求める。<br>個数：<strong>${totalCount}個 - ${baseCount}個 = ${extraCount}個</strong><br>単価：<strong>${unitPrice.toLocaleString()}円 × (1 - ${discountRate / 100}) = ${discountedUnitPrice.toLocaleString()}円</strong>`,
            `ステップ3：超過分の金額を計算する。<br><strong>${discountedUnitPrice.toLocaleString()}円 × ${extraCount}個 = ${extraTotal.toLocaleString()}円</strong>`,
            `ステップ4：合計金額を算出する。<br><strong>${baseTotal.toLocaleString()}円 + ${extraTotal.toLocaleString()}円 = ${totalPrice.toLocaleString()}円</strong>`
        ]
    };
}

    // 分割回数（割り切れやすい回数：5, 10, 12, 20回）

    const monthlyBase = Math.floor(totalWithFee / months);

    // 1回目以外（2回目以降）の毎月の支払額、または均等額

    const correctAnswerVal = isTotalQuestion ? totalWithFee : monthly;

    return {

// --- ④ 分割払い Lv.3: 定額で変化する変則分割（等差数列的支払い） ---
function genInstallment3() {
    // 分割回数（4〜6ヶ月）
    const months = getRandomInt(4, 6);
    
    // 初回の支払額（10,000円〜20,000円）
    const firstMonth = getRandomInt(10, 20) * 1000;
    
    // 毎月増額（減額）される金額（1,000円〜3,000円）
    const stepAmount = getRandomInt(1, 3) * 1000;
    
    // 等差数列の和の公式を用いて総額を計算
    // Sn = n * (2a + (n - 1)d) / 2
    const total = (months * (2 * firstMonth + (months - 1) * stepAmount)) / 2;
    
    // 最終回の支払額
    const lastMonth = firstMonth + (months - 1) * stepAmount;

    // 問い：最終回の支払額を求めさせる
    return {
        unit: '分割払い', level: 3, badge: 'Lv.3 高難度', title: '毎月定額増額する変則分割（等差型）',
        text: `総額 ${total.toLocaleString()}円 の高額商品を ${months}ヶ月の分割払いで購入した。` +
              `1ヶ月目の支払額は ${firstMonth.toLocaleString()}円 で、2ヶ月目以降は毎月前の月より ${stepAmount.toLocaleString()}円 ずつ多く支払う約束になっている。`,
        prompt: `最終月（${months}ヶ月目）の支払額はいくらか。`,
        correctAnswer: lastMonth,
        unitSuffix: '円',
        step: 1000,
        steps: [
            `ステップ1：毎月の増加額から ${months}ヶ月目の単価計算式を立てる。<br><strong>1ヶ月目 + (増額分 × (${months} - 1)回)</strong>`,
            `ステップ2：増加分の合計額を計算する。<br><strong>${stepAmount.toLocaleString()}円 × ${months - 1}回 = ${(stepAmount * (months - 1)).toLocaleString()}円</strong>`,
            `ステップ3：初月の支払額に加算する。<br><strong>${firstMonth.toLocaleString()}円 + ${(stepAmount * (months - 1)).toLocaleString()}円 = ${lastMonth.toLocaleString()}円</strong>`
        ]
    };
}

// --- ⑤ 速さ Lv.2: 旅人算（追いつき）＆ 平均の速さ ---
function genSpeed2() {
    const isCatchUp = Math.random() < 0.5;

    if (isCatchUp) {
        // 【パターンA】追いつき旅人算
        const diffMinutes = [10, 15, 20, 30][getRandomInt(0, 3)]; // 先発のリード時間（分）
        const speedWalk = 60; // 先発（徒歩）：分速60m
        const leadDistance = speedWalk * diffMinutes; // リードしている距離
        
        // 追いつく時間（10〜30分）
        const catchTime = [10, 15, 20, 30][getRandomInt(0, 3)]; 
        // 追いつくために必要な速さの差 = リード距離 ÷ 時間
        const speedDiff = leadDistance / catchTime;
        const speedRun = speedWalk + speedDiff; // 後発（自転車・走る）：分速

        return {
            unit: '速さ', level: 2, badge: 'Lv.2 応用', title: '追いつき旅人算',
            text: `Aが分速 ${speedWalk}m で出発した ${diffMinutes}分 後に、Bが同じ地点から分速 ${speedRun}m でAを追いかけた。`,
            prompt: 'Bが出発してから何分後にAに追いつくか。',
            correctAnswer: catchTime,
            unitSuffix: '分後',
            step: 1,
            steps: [
                `ステップ1：Bが出発するまでにAが進んだ距離（差）を求める。<br><strong>${speedWalk}m/分 × ${diffMinutes}分 = ${leadDistance}m</strong>`,
                `ステップ2：1分間にBがAとの距離を縮める速さ（差）を求める。<br><strong>${speedRun}m/分 - ${speedWalk}m/分 = ${speedDiff}m/分</strong>`,
                `ステップ3：追いつくのにかかる時間を求める。<br><strong>${leadDistance}m ÷ ${speedDiff}m/分 = ${catchTime}分後</strong>`
            ]
        };
    } else {
        // 【パターンB】往復の平均の速さ
        // 片道の距離（km）
        const distance = [60, 120, 180][getRandomInt(0, 2)];
        const speedGoing = 60; // 行き：時速60km
        const speedReturn = 40; // 帰り：時速40km
        
        const timeGoing = distance / speedGoing; // 行きの時間
        const timeReturn = distance / speedReturn; // 帰りの時間
        const totalDistance = distance * 2;
        const totalTime = timeGoing + timeReturn;
        
        // 平均の速さ = 全距離 ÷ 全時間 ( (60*40*2)/(60+40) = 48km/h )
        const avgSpeed = totalDistance / totalTime;

        return {
            unit: '速さ', level: 2, badge: 'Lv.2 応用', title: '往復の平均速度',
            text: `A地点とB地点の間（片道 ${distance}km）を往復した。行きは時速 ${speedGoing}km、帰りは時速 ${speedReturn}km で走った。`,
            prompt: '往復の平均の速さは時速何kmか。',
            correctAnswer: avgSpeed,
            unitSuffix: 'km/h',
            step: 1,
            steps: [
                `ステップ1：行きと帰りにかかる時間をそれぞれ求める。<br>行き：<strong>${distance}km ÷ ${speedGoing}km/h = ${timeGoing}時間</strong><br>帰り：<strong>${distance}km ÷ ${speedReturn}km/h = ${timeReturn}時間</strong>`,
                `ステップ2：往復の全距離と合計時間を求める。<br>全距離：<strong>${distance}km × 2 = ${totalDistance}km</strong><br>全時間：<strong>${timeGoing} + ${timeReturn} = ${totalTime}時間</strong>`,
                `ステップ3：全距離を全時間で割って平均速度を算出する。<br><strong>${totalDistance}km ÷ ${totalTime}時間 = ${avgSpeed}km/h</strong>`
            ]
        };
    }
}

// --- ⑥ 損益算 Lv.2: 分割販売（定価販売＋割引販売） ---
function genProfit2() {
    // 1個あたりの原価（100円〜500円）
    const cost = getRandomInt(1, 5) * 100;
    
    // 見込み利益率（20%、30%、40%、50%）
    const markupRate = [20, 30, 40, 50][getRandomInt(0, 3)];
    const listPrice = Math.round(cost * (1 + markupRate / 100)); // 定価
    
    // 全体の仕入れ個数（100個）
    const totalCount = 100;
    const totalCost = cost * totalCount; // 総仕入れ額
    
    // 定価で売れた割合（60%〜80%）
    const regularRatio = [60, 70, 80][getRandomInt(0, 2)];
    const regularCount = totalCount * (regularRatio / 100);
    const discountCount = totalCount - regularCount;
    
    // 残りの割引率（10%引き、20%引き、30%引き）
    const discountRate = [10, 20, 30][getRandomInt(0, 2)];
    const discountPrice = Math.round(listPrice * (1 - discountRate / 100)); // 割引売価
    
    // 売上総額と利益の計算
    const salesRegular = listPrice * regularCount;
    const salesDiscount = discountPrice * discountCount;
    const totalSales = salesRegular + salesDiscount;
    const totalProfit = totalSales - totalCost;

    return {
        unit: '損益算', level: 2, badge: 'Lv.2 応用', title: '定価と割引での分割販売',

// --- ⑥ 損益算 Lv.3: 目標利益率から処分価格の割引率を逆算 ---
function genProfit3() {
    // わかりやすく全体を100個として計算
    const totalCount = 100;
    
    // 定価で売れた割合（70%）
    const regularCount = 70;
    const discountCount = 30;
    
    // 定価の利益率（50%増し：原価の1.5倍）
    const markupRate = 50; 
    
    // 目標とする全体の利益率（例：26%、29%、32%など整数に収まる値を選択）
    // 定価で 70個 × 1.5 = 105 の売上。
    // 全体利益率 targetRate (%) のとき、必要な売上＝ 100 + targetRate
    // 割引分 30個 で必要な売上＝ (100 + targetRate) - 105 = targetRate - 5
    // 割引売価(原価比) = (targetRate - 5) / 30
    // これが「定価(1.5)」に対していくら引きか：
    // 例: targetRate = 26% の場合
    // 全体売上 126。定価売上 105。残り売上 21。
    // 割引売価 = 21 / 30 = 0.7 (原価の70%)
    // 定価(1.5)に対する割合 = 0.7 / 1.5 = 7/15 （非割り切り回避のため固定セットから抽選）

    // きれいに割り切れるパターン設定
    // 原価100、定価150（50%利益）
    // 70個定価売上 = 10,500円
    // パターン1: 割引率20%引き（売価120円） -> 30個売上3,600円 -> 総売上14,100円（原価10,000円） -> 全体利益41%
    // パターン2: 割引率30%引き（売価105円） -> 30個売上3,150円 -> 総売上13,650円（原価10,000円） -> 全体利益36.5%
    // パターン3: 割引率40%引き（売価90円）  -> 30個売上2,700円 -> 総売上13,200円（原価10,000円） -> 全体利益32%
    // パターン4: 割引率50%引き（売価75円）  -> 30個売上2,250円 -> 総売上12,750円（原価10,000円） -> 全体利益27.5%

    const patterns = [
        { targetProfitPercent: 41, discountRate: 20, discountPriceRatio: 1.2 },
        { targetProfitPercent: 32, discountRate: 40, discountPriceRatio: 0.9 }
    ];
    
    const selected = patterns[getRandomInt(0, patterns.length - 1)];

    return {
        unit: '損益算', level: 3, badge: 'Lv.3 高難度', title: '目標利益からの割引率の逆算',
        text: `ある商品を原価の ${markupRate}% の利益を見込んで定価をつけて販売した。<br>` +
              `仕入れた個数の ${regularCount}% が定価で売れたため、残りの ${discountCount}% を定価から一定の割合で割り引いてすべて売り切った。<br>` +
              `その結果、全体として仕入れ総額の ${selected.targetProfitPercent}% の利益を得ることができた。`,
        prompt: '売れ残りを定価の何%引きで販売したか。',
        correctAnswer: selected.discountRate,
        unitSuffix: '%引き',
        step: 5,
        steps: [
            `ステップ1：商品1個の原価を100とし、全体量を100個として計算する。<br>仕入れ総額：<strong>100 × 100 = 10,000</strong><br>定価：<strong>100 × (1 + 0.5) = 150</strong>`,
            `ステップ2：全体で得た売上目標額と、定価で売れた分の売上額を求める。<br>目標売上総額：<strong>10,000 × (1 + ${selected.targetProfitPercent/100}) = ${(10000 * (1 + selected.targetProfitPercent/100)).toLocaleString()}</strong><br>定価分の売上：<strong>150 × ${regularCount}個 = ${(150 * regularCount).toLocaleString()}</strong>`,
            `ステップ3：残りの ${discountCount}個 で必要な売上額と、その1個あたりの販売価格を求める。<br>残り分の売上額：<strong>${(10000 * (1 + selected.targetProfitPercent/100)).toLocaleString()} - ${(150 * regularCount).toLocaleString()} = ${(10000 * (1 + selected.targetProfitPercent/100) - 150 * regularCount).toLocaleString()}</strong><br>割引後の売価：<strong>${(10000 * (1 + selected.targetProfitPercent/100) - 150 * regularCount).toLocaleString()} ÷ ${discountCount}個 = ${100 * selected.discountPriceRatio}</strong>`,
            `ステップ4：定価（150）に対する割引率を算出する。<br><strong>(150 - ${100 * selected.discountPriceRatio}) ÷ 150 = ${selected.discountRate / 100} （${selected.discountRate}%引き）</strong>`
        ]
    };
}
// --- ⑦ 場合の数・確率 Lv.1: 条件付き順列（隣り合い） ---
function genProbability1() {
    // 男子3人、女子2人の並び替え（女子2人が必ず隣り合う）
    // 男子: 3〜4人、女子: 2人で動的に生成
    const menCount = getRandomInt(3, 4);
    const womenCount = 2; // 女子2人は隣り合う
    const totalPeople = menCount + womenCount;

    // 計算ロジック: 女子2人を1グループとみなす -> (menCount + 1)! × 2!
    function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
    
    const groupCount = menCount + 1;
    const ways = factorial(groupCount) * factorial(womenCount);

    return {
        unit: '場合の数・確率', level: 1, badge: 'Lv.1 基本', title: '場合の数・特定要素の隣り合い',
        text: `男子 ${menCount}人 と女子 ${womenCount}人 の合計 ${totalPeople}人 が一列に並ぶ。`,
        prompt: '女子2人が必ず隣り合う並び方は何通りか。',
        correctAnswer: ways,
        unitSuffix: '通り',
        step: 12,
        steps: [
            `ステップ1：隣り合う女子2人を「1つのグループ」としてまとめる。<br>並べる対象は男子 ${menCount}人 ＋ 女子グループ1個 ＝ <strong>${groupCount}要素</strong>。`,
            `ステップ2：${groupCount}要素の並び方を計算する。<br><strong>${groupCount}! ＝ ${factorial(groupCount)}通り</strong>`,
            `ステップ3：女子グループ内での2人の並び替えを考慮する。<br><strong>2! ＝ 2通り</strong>`,
            `ステップ4：積の法則により全体を算出する。<br><strong>${factorial(groupCount)} × 2 ＝ ${ways}通り</strong>`
        ]
    };
}

// --- ⑦ 場合の数・確率 Lv.3: 条件付き確率（原因の確率） ---
function genProbability6() {
    // 工場Aと工場Bで同じ製品を作っている。
    // Aの生産量割合: 60%, Bの生産量割合: 40%
    // Aの不良品率: 2%, Bの不良品率: 5%
    // 不良品が1個選ばれたとき、それがA工場で作られた確率
    // P(A∩不良) = 0.60 × 0.02 = 0.012
    // P(B∩不良) = 0.40 × 0.05 = 0.020
    // 全不良率 = 0.032
    // 求める条件付き確率 = 0.012 / 0.032 = 12/32 = 3/8
    
    return {
        unit: '場合の数・確率', level: 3, badge: 'Lv.3 高難度', title: '確率・条件付き確率（原因の探求）',

        prompt: 'その不良品が「工場A」で生産されたものである確率はいくらか。',
        correctAnswer: 3, unitSuffix: '/8', isFraction: true,
        customChoices: [

            { label: 'E', value: 5, htmlText: '3/5', isCorrect: false },
            { label: 'F', value: 6, htmlText: 'いずれでもない', isCorrect: false }
        ],
        steps: [
            `ステップ1：全体の中から「Aの不良品」と「Bの不良品」が発生する割合をそれぞれ計算する。<br>Aの不良品：<strong>0.60 × 0.02 ＝ 0.012（1.2%）</strong><br>Bの不良品：<strong>0.40 × 0.05 ＝ 0.020（2.0%）</strong>`,
            `ステップ2：取り出した製品が不良品である全体割合（分母）を求める。<br><strong>0.012 ＋ 0.020 ＝ 0.032（3.2%）</strong>`,
            `ステップ3：条件付き確率の公式（Aの不良品 ÷ 全体の不良品）を計算する。<br><strong>0.012 / 0.032 ＝ 12 / 32 ＝ 3/8（正解はB）</strong>`
        ]
    };
}
        function generateChoices(q) {
            //            if (q.customChoices) return q.customChoices;
            const correctVal = q.correctAnswer;
            const unitSuffix = q.unitSuffix || '';
            const step = q.step || 1;
            const isFCorrect = Math.random() < 0.20;

            let pool = new Set();
            if (!isFCorrect) pool.add(correctVal);

            let attempts = 0;
            while (pool.size < 5 && attempts < 100) {
                attempts++;
                const offset = (getRandomInt(1, 4) * (Math.random() < 0.5 ? 1 : -1)) * step;
                const candidate = correctVal + offset;
                if (candidate > 0 && candidate !== correctVal) pool.add(candidate);
            }
            let extra = 1;
            while (pool.size < 5) {
                const candidate = correctVal + extra * step;
                if (!pool.has(candidate)) pool.add(candidate);
                extra++;
            }

            const labels = ['A', 'B', 'C', 'D', 'E', 'F'];
            const numChoices = Array.from(pool).sort((a, b) => a - b);
            let choices = [];

            for (let i = 0; i < 5; i++) {
                const val = numChoices[i];
                choices.push({
                    label: labels[i],
                    value: val,
                    htmlText: unitSuffix === '円' ? formatYen(val) : `${val.toLocaleString()}${unitSuffix}`,
                    isCorrect: !isFCorrect && val === correctVal
                });
            }
            choices.push({
                label: 'F', value: 'none', htmlText: 'いずれでもない', isCorrect: isFCorrect
            });
            return choices;
        }

            const setPool = [genSet1, genSet2, genSet3];

            const discountPool = [genDiscount1, genDiscount2, genDiscount3];

            const speedPool = [genSpeed1, genSpeed2, genSpeed3];

            const probabilityPool = [genProbability1, genProbability2, genProbability3, genProbability4, genProbability5, genProbability6];
            
            let pool = [];
            // CBTモードの場合は強制的に全分野からランダム出題
            const activeUnit = isCBTMode ? 'all' : configUnit;
            const activeLevel = isCBTMode ? String(cbtCurrentLevel) : configLevel;

            if (activeUnit === 'all') pool = [...setPool, ...settlementPool, ...discountPool, ...installmentPool, ...speedPool, ...profitPool, ...probabilityPool];
            else if (activeUnit === 'set') pool = setPool;
            else if (activeUnit === 'settlement') pool = settlementPool;
            else if (activeUnit === 'discount') pool = discountPool;
            else if (activeUnit === 'installment') pool = installmentPool;
            else if (activeUnit === 'speed') pool = speedPool;
            else if (activeUnit === 'profit') pool = profitPool;
            else if (activeUnit === 'probability') pool = probabilityPool;

            let candidates = pool.map(fn => fn());
            if (activeLevel !== 'all') {
                candidates = candidates.filter(q => q.level === parseInt(activeLevel));
            }
            if (candidates.length === 0) candidates = pool.map(fn => fn());

            currentQuestion = candidates[Math.floor(Math.random() * candidates.length)];
            currentQuestion.choices = generateChoices(currentQuestion);

            isAnswered = false;
            document.getElementById('explanation-card').classList.add('hidden');

                btn.onclick = () => selectAnswer(c, btn);
                btn.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <span class="w-6 h-6 rounded-lg bg-slate-800 font-bold text-slate-300 flex items-center justify-center text-xs border border-slate-700">
                            ${c.label}
                        </span>
                        <span class="font-medium text-slate-200 text-xs md:text-sm">${c.htmlText}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-500 choice-icon"></i>
                `;
                choicesContainer.appendChild(btn);
            });

            choicesContainer.classList.remove('pointer-events-none');
            startQuestionTimer(currentQuestion.level);
        }

        function startQuestionTimer(level) {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            // レベル3の制限時間を120秒に変更しました
            maxQuestionTime = level === 1 ? 75 : (level === 2 ? 100 : 120);
            timerDurationMs = maxQuestionTime * 1000;
            timerStartTime = Date.now();
            remainingQuestionTime = maxQuestionTime;
            
            updateTimerBarSmooth();
            questionTimerInterval = setInterval(() => {
                const elapsed = Date.now() - timerStartTime;
                remainingQuestionTime = Math.max(0, (timerDurationMs - elapsed) / 1000);
                if (remainingQuestionTime <= 0) {
                    clearInterval(questionTimerInterval);
                    handleTimeOut();
                }
            }, 100);
        }

        function updateTimerBarSmooth() {
            const timerBar = document.getElementById('timer-bar');
            if (!timerBar) return;
            const elapsed = Date.now() - timerStartTime;
            const percentage = Math.max(0, ((timerDurationMs - elapsed) / timerDurationMs) * 100);
            timerBar.style.width = `${percentage}%`;

            if (percentage > 50) timerBar.className = 'bg-indigo-500 h-full transition-all duration-100 linear';
            else if (percentage > 20) timerBar.className = 'bg-amber-500 h-full transition-all duration-100 linear';
            else timerBar.className = 'bg-rose-500 h-full transition-all duration-100 linear';

            if (!isAnswered && remainingQuestionTime > 0) {
                requestAnimationFrame(updateTimerBarSmooth);
            }
        }

        function handleTimeOut() {
            if (isAnswered) return;
            isAnswered = true;

            const correctChoiceObj = currentQuestion.choices.find(c => c.isCorrect);
            sessionAnswers.unshift({
                question: currentQuestion.text,
                prompt: currentQuestion.prompt,
                unit: currentQuestion.unit,
                badge: currentQuestion.badge,
                selectedLabel: '時間切れ',
                selectedText: '未回答（タイムアウト）',
                correctLabel: correctChoiceObj.label,
                correctText: correctChoiceObj.htmlText,
                isCorrect: false,
                steps: currentQuestion.steps
            });

            if (isCBTMode) {
                cbtHistory.push({ question: currentQuestion, selectedChoice: null, isCorrect: false, level: cbtCurrentLevel });
                cbtCurrentLevel = Math.max(1, cbtCurrentLevel - 1);
                cbtQuestionIndex++;
                generateCBTQuestion();
                return;
            }

            totalCount++;
            updateStats();
            recordPracticeSessionToGlobal();

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.classList.add('pointer-events-none');

            const choiceBtns = choicesContainer.querySelectorAll('.choice-btn');
            currentQuestion.choices.forEach((c, idx) => {
                const btn = choiceBtns[idx];
                const icon = btn.querySelector('.choice-icon');
                if (c.isCorrect) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-950/40', 'text-emerald-200');
                    icon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
                }
            });

            showExplanation(false, null, true);
        }

        function selectAnswer(choice, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            if (questionTimerInterval) clearInterval(questionTimerInterval);
            const isCorrect = choice.isCorrect;
            const correctChoiceObj = currentQuestion.choices.find(c => c.isCorrect);

            sessionAnswers.unshift({
                question: currentQuestion.text,
                prompt: currentQuestion.prompt,
                unit: currentQuestion.unit,
                badge: currentQuestion.badge,
                selectedLabel: choice.label,
                selectedText: choice.htmlText,
                correctLabel: correctChoiceObj.label,
                correctText: correctChoiceObj.htmlText,
                isCorrect: isCorrect,
                steps: currentQuestion.steps
            });

            if (isCBTMode) {
                cbtHistory.push({ question: currentQuestion, selectedChoice: choice, isCorrect: isCorrect, level: cbtCurrentLevel });
                cbtCurrentLevel = isCorrect ? Math.min(3, cbtCurrentLevel + 1) : Math.max(1, cbtCurrentLevel - 1);
                cbtQuestionIndex++;
                generateCBTQuestion();
                return;
            }

            totalCount++;
            if (isCorrect) correctCount++;
            updateStats();
            recordPracticeSessionToGlobal();

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.classList.add('pointer-events-none');

            const choiceBtns = choicesContainer.querySelectorAll('.choice-btn');
            currentQuestion.choices.forEach((c, idx) => {
                const btn = choiceBtns[idx];
                const icon = btn.querySelector('.choice-icon');
                if (c.isCorrect) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-950/40', 'text-emerald-200');
                    icon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
                } else if (c === choice && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-950/40', 'text-rose-200');
                    icon.className = 'fa-solid fa-circle-xmark text-rose-400 text-base';
                }
            });

            showExplanation(isCorrect, choice, false);
        }

        function showExplanation(isCorrect, selectedChoice, isTimeout) {
            const expCard = document.getElementById('explanation-card');
            const resultBanner = document.getElementById('result-banner');
            const correctChoiceObj = currentQuestion.choices.find(c => c.isCorrect);

            if (isTimeout) {
                resultBanner.className = 'rounded-2xl p-3.5 mb-4 flex items-center space-x-3 bg-rose-950/80 text-rose-200 border border-rose-800/60';
                resultBanner.innerHTML = `<i class="fa-solid fa-clock text-rose-400 text-xl"></i><div><p class="font-bold text-xs md:text-sm">時間切れです</p><p class="text-[11px] text-rose-300">正解：<strong>${correctChoiceObj.label} (${correctChoiceObj.htmlText})</strong></p></div>`;
            } else if (isCorrect) {
                resultBanner.className = 'rounded-2xl p-3.5 mb-4 flex items-center space-x-3 bg-emerald-950/80 text-emerald-200 border border-emerald-800/60';
                resultBanner.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-xl"></i><div><p class="font-bold text-xs md:text-sm">正解です！</p><p class="text-[11px] text-emerald-300">正解：<strong>${correctChoiceObj.htmlText}</strong></p></div>`;
            } else {
                resultBanner.className = 'rounded-2xl p-3.5 mb-4 flex items-center space-x-3 bg-rose-950/80 text-rose-200 border border-rose-800/60';
                resultBanner.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400 text-xl"></i><div><p class="font-bold text-xs md:text-sm">不正解です</p><p class="text-[11px] text-rose-300">正解：<strong>${correctChoiceObj.label} (${correctChoiceObj.htmlText})</strong></p></div>`;
            }

            document.getElementById('explanation-content').innerHTML = currentQuestion.steps
                .map(step => `<div class="bg-[#1b233a] border-l-4 border-indigo-500 p-3 rounded-r-xl text-slate-200">${step}</div>`)
                .join('');
            expCard.classList.remove('hidden');
        }

        function openReviewModal() {
            const listEl = document.getElementById('session-review-list');
            document.getElementById('review-count-info').innerText = `全 ${sessionAnswers.length} 問の履歴`;
            if (sessionAnswers.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">まだ今回の演習で解答した問題はありません</div>`;
            } else {
                listEl.innerHTML = sessionAnswers.map((item, idx) => `
                    <div class="bg-[#1b233a] border ${item.isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} rounded-2xl p-4 text-xs">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center space-x-1.5">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${item.isCorrect ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'}">
                                    ${item.isCorrect ? '正解' : '不正解'}
                                </span>
                                <span class="text-slate-400 text-[10px]">${item.unit} / ${item.badge}</span>
                            </div>
                            <span class="text-slate-500 text-[10px]">#${sessionAnswers.length - idx}</span>
                        </div>
                        <p class="text-slate-200 font-medium mb-2 leading-relaxed">${item.question}</p>
                        <div class="bg-[#1c243c] border-l-4 border-indigo-500 p-2.5 rounded-r-xl mb-3 text-indigo-200 font-bold text-xs">
                            ${item.prompt}
                        </div>
                        <div class="bg-[#111827] p-2.5 rounded-xl space-y-1 text-[11px] mb-2 border border-slate-800">
                            <div class="flex justify-between">
                                <span class="text-slate-400">あなたの解答:</span>
                                <span class="font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${item.selectedLabel}: ${item.selectedText}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">正解:</span>
                                <span class="font-bold text-emerald-400">${item.correctLabel}: ${item.correctText}</span>
                            </div>
                        </div>
                        <details class="text-[11px] text-indigo-300 cursor-pointer">
                            <summary class="font-bold hover:text-indigo-200">解説・ステップを表示</summary>
                            <div class="mt-2 space-y-1.5 text-slate-300 pt-2 border-t border-slate-800">
                                ${item.steps.map(s => `<div class="bg-[#141a2e] p-2 rounded border-l-2 border-indigo-500">${s}</div>`).join('')}
                            </div>
                        </details>
                    </div>
                `).join('');
            }
            document.getElementById('review-modal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        function openHistoryModal() {
            const listEl = document.getElementById('global-history-list');
            if (globalHistory.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">まだ履歴はありません</div>`;
            } else {
                listEl.innerHTML = globalHistory.map(item => `
                    <div class="bg-[#1b233a] border border-slate-800 rounded-xl p-3 text-xs">
                        <div class="flex justify-between text-slate-400 text-[10px] mb-1">
                            <span>${item.type}</span><span>${item.date}</span>
                        </div>
                        <div class="flex justify-between font-bold text-white">
                            <span>${item.scoreText}</span><span class="text-teal-400">${item.accuracy}%</span>
                        </div>
                    </div>
                `).join('');
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function clearGlobalHistory() {
            globalHistory = [];
            saveGlobalHistory();
            openHistoryModal();
        }

        // CBT Modals Functions
        function openCBTModal() { document.getElementById('cbt-modal').classList.remove('hidden'); }
        function closeCBTModal() { document.getElementById('cbt-modal').classList.add('hidden'); }

        function startCBTMode(type) {
            closeCBTModal();
            hideAllViews();
            isCBTMode = true;
            cbtModeType = type;
            cbtTotalQuestions = type === 'mini' ? 10 : 20;
            cbtMaxOverallTime = type === 'mini' ? 900 : 1800;
            cbtQuestionIndex = 0;
            cbtCurrentLevel = 1;
            cbtHistory = [];
            sessionAnswers = [];

            document.getElementById('practice-config-banner').classList.add('hidden');
            document.getElementById('cbt-status-bar').classList.remove('hidden');
            document.getElementById('view-practice').classList.remove('hidden');
            generateCBTQuestion();
        }

        function generateCBTQuestion() {
            if (cbtQuestionIndex >= cbtTotalQuestions) {
                finishCBTMode();
                return;
            }
            document.getElementById('cbt-progress-text').innerText = `第 ${cbtQuestionIndex + 1} / ${cbtTotalQuestions} 問 (現在 Lv.${cbtCurrentLevel})`;
            generateNewQuestion();
        }

        function exitCBTMode() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            isCBTMode = false;
            // CBT終了時にメタヘータ表示を元に戻せるようにしておく
            const metaHeader = document.getElementById('q-meta-header');
            if (metaHeader) metaHeader.classList.remove('hidden');
            goToLanding();
        }

        function finishCBTMode() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
            hideAllViews();
            const metaHeader = document.getElementById('q-meta-header');
            if (metaHeader) metaHeader.classList.remove('hidden');
            const score = cbtHistory.filter(h => h.isCorrect).length;
            const accuracy = Math.round((score / cbtTotalQuestions) * 100);

            document.getElementById('cbt-res-score').innerText = `${score} / ${cbtTotalQuestions}`;
            document.getElementById('cbt-res-accuracy').innerText = `${accuracy} %`;
            document.getElementById('cbt-res-final-lvl').innerText = `Lv.${cbtCurrentLevel}`;
            
            globalHistory.unshift({
                type: cbtModeType === 'mini' ? 'CBT ミニテスト (10問)' : 'CBT フル模擬試験 (20問)',
                scoreText: `${score} / ${cbtTotalQuestions}問正解`,
                accuracy: accuracy,
                date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            });
            if (globalHistory.length > 10) globalHistory.pop();
            saveGlobalHistory();

            document.getElementById('cbt-result-card').classList.remove('hidden');
        }

        function updateStats() {
            const accEl = document.getElementById('stat-accuracy');
            if (accEl) {
                const acc = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
                accEl.innerText = `${acc} % (${correctCount}/${totalCount})`;
            }
        }

        function resetStats() {
            totalCount = 0;
            correctCount = 0;
            updateStats();
            sessionAnswers = [];
            globalHistory = [];
            saveGlobalHistory();
        }

        function recordPracticeSessionToGlobal() {
            if (totalCount > 0 && totalCount % 5 === 0) {
                const acc = Math.round((correctCount / totalCount) * 100);
                // Avoid duplicating the exact same count record
                const existingIndex = globalHistory.findIndex(h => h.type.includes('通常問題演習') && h.date.includes(new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })));
                const record = {
                    type: '通常問題演習',
                    scoreText: `${correctCount} / ${totalCount}問正解`,
                    accuracy: acc,
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                };
                if (existingIndex !== -1) {
                    globalHistory[existingIndex] = record;
                } else {
                    globalHistory.unshift(record);
                }
                if (globalHistory.length > 10) globalHistory.pop();
                saveGlobalHistory();
            }
        }

        function saveGlobalHistory() {
            try {
                localStorage.setItem('spi_global_history', JSON.stringify(globalHistory));
                localStorage.setItem('spi_total_count', totalCount);
                localStorage.setItem('spi_correct_count', correctCount);
            } catch (e) {
                console.error(e);
            }
        }

        function loadGlobalHistory() {
            try {
                const saved = localStorage.getItem('spi_global_history');
                if (saved) globalHistory = JSON.parse(saved);
                const tCount = localStorage.getItem('spi_total_count');
                const cCount = localStorage.getItem('spi_correct_count');
                if (tCount !== null) totalCount = parseInt(tCount);
                if (cCount !== null) correctCount = parseInt(cCount);
                updateStats();
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = function() {
            loadGlobalHistory();
        };
    </script>
</body>
</html>
